  g.add(d1);
  const d2 = new THREE.Mesh(bevelledBox(CELL*0.6, CELL*0.1, CELL*0.6, bevelAmount()), daisMat);
  d2.position.set(0, CELL*0.17, 0); d2.castShadow = true; d2.receiveShadow = true;
  g.add(d2);
  // a small dormant marker stone in the centre — glows gently even while
  // dormant so you can spot the shrine, then blazes when awake
  const markMat = new THREE.MeshLambertMaterial({ color:0xb8a89a, emissive:0x4a3a2a });
  const mark = new THREE.Mesh(new THREE.ConeGeometry(CELL*0.16, CELL*0.5, 5), markMat);
  mark.position.set(0, CELL*0.47, 0); mark.rotation.y = Math.PI/5;
  mark.castShadow = true;
  g.add(mark);
  keystoneGroup.userData.mark = mark;
  // a faint dormant light column — thin and dim, a candle not a beacon — so the
  // shrine reads as "something here" from across the surface before it wakes
  const dormMat = new THREE.MeshBasicMaterial({
    color:0xe8c890, transparent:true, opacity:0.18,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
  const dormCol = new THREE.Mesh(
    new THREE.CylinderGeometry(CELL*0.06, CELL*0.14, CELL*1.1, 5, 1, true), dormMat);
  dormCol.position.set(0, CELL*0.9, 0);
  g.add(dormCol);
  keystoneGroup.userData.dormant = dormCol;
}

// ---------- push-block puzzle (PUZZLE objective) ----------
// Sokoban on the cube surface: push blocks onto target pads. State lives in
// pushBlocks (cellKey -> mesh); pads are target cells. You win when every block
// sits on a pad. Pushing respects the movement graph, so blocks slide across
// cube edges just as the player does.
const pushBlocks = new Map();     // current cellKey -> { mesh }
const pushPads = new Map();       // pad cellKey -> mesh
let pushGroup = null;

function clearPushPuzzle(){
  pushBlocks.clear();
  pushPads.clear();
  pushGroup = null;
}

// find the cell you reach stepping from (fi,u,v) in world-direction D, using the
// same edge-aware graph the player moves on. Returns [nf,nu,nv] or null.
function cellStep(fi, u, v, D){
  let bestC = null, bestDot = 0.9;
  for (const [nf, nu, nv, , dir] of cellNeighbours(fi, u, v)){
    const d = dir.dot(D);
    if (d > bestDot){ bestDot = d; bestC = [nf, nu, nv]; }
  }
  return bestC;
}

function placePushPuzzle(){
  clearPushPuzzle();
  pushGroup = new THREE.Group();
  levelGroup.add(pushGroup);
  const count = Math.min(1 + (level >> 1), 4);   // 1-4 blocks

  // SOLVABILITY: reverse-push to seed a likely-solvable layout, then VERIFY each
  // block/pad pair with a real Sokoban state-search and retry on the rare
  // unsolvable case. Reverse-push alone is ~88% solvable (the player can't
  // always navigate to the pushing spot); the verify closes the gap to 100%.
  const dist = bfsFrom(2, 2, 2);
  const walkKeys = [...dist.keys()];
  const usedPad = new Set(), usedBlock = new Set();
  let placed = 0, guard = 0;
  while (placed < count && guard++ < 200){
    const padK = walkKeys[(Math.random()*walkKeys.length)|0];
    if (padK === cellKey(2,2,2) || usedPad.has(padK) || usedBlock.has(padK)) continue;

    // reverse-push the block away from the pad
    let curK = padK;
    const steps = 2 + (Math.random()*3|0);
    for (let s = 0; s < steps; s++){
      const [cf, cu, cv] = curK.split(',').map(Number);
      const opts = cellNeighbours(cf, cu, cv).filter(([nf,nu,nv,mk,dir]) => {
        const nk = cellKey(nf,nu,nv);
        if (blocked.has(nk) || holes.has(nk) || usedBlock.has(nk) || usedPad.has(nk)
            || nk === cellKey(2,2,2)) return false;
        if (mk && rails.has(mk)) return false;    // don't seed a block across a wall
        const behind = cellStep(nf, nu, nv, dir);
        if (!behind) return false;
        const behindK = cellKey(...behind);
        return !blocked.has(behindK) && !holes.has(behindK);
      });
      if (!opts.length) break;
      const [nf,nu,nv] = opts[(Math.random()*opts.length)|0];
      curK = cellKey(nf,nu,nv);
    }
    if (curK === padK) continue;                  // didn't move off the pad

    // per-block pre-filter: cheap rejection of a block that can't reach its pad
    // even alone (treating already-placed blocks as fixed).
    if (!pushSolvable(curK, padK, usedBlock)) continue;

    usedPad.add(padK); usedBlock.add(curK);
    placed++;
  }

  // JOINT solvability: the per-block filter misses cases where blocks wall each
  // other in (the level-9 failures). Verify the whole set together, and if it's
  // not solvable, drop blocks one at a time until it is — a smaller solvable
  // puzzle beats an impossible one. Runs once (not per placement) to stay fast.
  let blockList = [...usedBlock], padList = [...usedPad];
  while (blockList.length > 0 && !puzzleJointSolvable(blockList, padList)){
    blockList.pop(); padList.pop();               // drop the last-added pair
  }

  for (let i = 0; i < blockList.length; i++){
    addPushPad(padList[i]);
    addPushBlock(blockList[i]);
  }
  refreshPads();
  updateGemHUD();
  // guarantee at least one solvable block exists, or the puzzle is trivially won
  if (pushBlocks.size === 0) placeReachGoal();    // fallback: a plain reach goal
}

// Multi-block JOINT solvability: can ALL blocks be pushed onto ALL pads, given
// they interfere with each other? State = every block position + the player's
// reachable region. This is the real test — the per-block check misses cases
// where one block walls off the route needed to solve another.
function puzzleJointSolvable(blockKeys, padKeys){
  const startP = cellKey(2, 2, 2);
  const playerReach = (fromK, occ) => {
    const seen = new Set([fromK]), q = [fromK];
    for (let h = 0; h < q.length; h++){
      const [a,b,c] = q[h].split(',').map(Number);
      for (const [nf,nu,nv] of neighborsOf(a,b,c)){
        const k = cellKey(nf,nu,nv);
        if (seen.has(k) || blocked.has(k) || holes.has(k) || occ.has(k)) continue;
        seen.add(k); q.push(k);
      }
    }
    return seen;
  };
  const solved = bs => padKeys.every(p => bs.includes(p));
  const seen = new Set();
  const queue = [{ bs: blockKeys.slice().sort(), p: startP }];
  let iter = 0;
  const CAP = 40000;                  // bounded state expansions
  const t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const BUDGET_MS = 250;              // never hitch generation for a single check
  while (queue.length && iter++ < CAP){
    if ((iter & 1023) === 0){
      const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
      if (now - t0 > BUDGET_MS) return false;   // treat as unproven -> drop a block
    }
    const st = queue.shift();
    if (solved(st.bs)) return true;
    const occ = new Set(st.bs);
    const reach = playerReach(st.p, occ);
    const sig = st.bs.join(';') + '|' + [...reach].sort().join();
    if (seen.has(sig)) continue;
    seen.add(sig);
    for (let i = 0; i < st.bs.length; i++){
      const [bf, bu, bv] = st.bs[i].split(',').map(Number);
      for (const [nf, nu, nv, mk, dir] of cellNeighbours(bf, bu, bv)){
        const destK = cellKey(nf, nu, nv);
        if (blocked.has(destK) || holes.has(destK) || occ.has(destK)) continue;
        if (mk && rails.has(mk)) continue;
        const behind = cellStep(bf, bu, bv, dir.clone().negate());
        if (!behind) continue;
        if (!reach.has(cellKey(...behind))) continue;
        const nbs = st.bs.slice(); nbs[i] = destK; nbs.sort();
        queue.push({ bs: nbs, p: st.bs[i] });
      }
    }
  }
  return false;                       // exhausted (or hit cap) without solving
}

// Sokoban single-block solvability: can the block at blockK be pushed to padK,
// with the player starting at cell 0 and `fixed` cells (other blocks) immovable?
function pushSolvable(blockK, padK, fixed){
  const playerReach = (fromK, blockAt) => {
    // BFS of cells the player can walk to, with blockAt + fixed impassable
    const seen = new Set([fromK]);
    const q = [fromK];
    for (let h = 0; h < q.length; h++){
      const [a,b,c] = q[h].split(',').map(Number);
      for (const [nf,nu,nv] of neighborsOf(a,b,c)){
        const k = cellKey(nf,nu,nv);
        if (seen.has(k) || blocked.has(k) || holes.has(k)
            || k === blockAt || fixed.has(k)) continue;
        seen.add(k); q.push(k);
      }
    }
    return seen;
  };
  const startP = cellKey(2,2,2);
  const seenStates = new Set();
  const queue = [{ b: blockK, p: startP }];
  let iter = 0;
  while (queue.length && iter++ < 4000){
    const st = queue.shift();
    if (st.b === padK) return true;
    const reach = playerReach(st.p, st.b);
    const sig = st.b + '|' + [...reach].sort().join();
    if (seenStates.has(sig)) continue;
    seenStates.add(sig);
    const [bf, bu, bv] = st.b.split(',').map(Number);
    // for each direction the block could be pushed
    for (const [nf, nu, nv, mk, dir] of cellNeighbours(bf, bu, bv)){
      const destK = cellKey(nf, nu, nv);
      if (blocked.has(destK) || holes.has(destK) || fixed.has(destK)) continue;
      if (mk && rails.has(mk)) continue;         // can't push a block through a wall
      // player must stand on the opposite side to push
      const behind = cellStep(bf, bu, bv, dir.clone().negate());
      if (!behind) continue;
      const behindK = cellKey(...behind);
      if (!reach.has(behindK)) continue;
      queue.push({ b: destK, p: st.b });         // player ends where block was
    }
  }
  return false;
}

function addPushBlock(k){
  const [fi, u, v] = k.split(',').map(Number);
  const n = FACES[fi].n;
  const base = cellToPoint(fi, u, v);
  const geo = bevelledBox(BLOCK*0.82, BLOCK*0.82, BLOCK*0.82, bevelAmount()*1.4);
  const mat = new THREE.MeshLambertMaterial({ color:0xc8794a });   // warm clay, stands out
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.position.copy(base).addScaledVector(n, CELL*0.41 + faceLift(fi));
  mesh.quaternion.setFromUnitVectors(_upY, n);
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
  pushGroup.add(mesh);
  pushBlocks.set(k, { mesh });
}

function addPushPad(k){
  const [fi, u, v] = k.split(',').map(Number);
  const n = FACES[fi].n;
  const base = cellToPoint(fi, u, v);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(CELL*0.24, CELL*0.38, 20),
    new THREE.MeshBasicMaterial({ color:0xe0a03a, side:THREE.DoubleSide,
      transparent:true, opacity:0.85 }));
  ring.position.copy(base).addScaledVector(n, 0.02 + faceLift(fi));
  ring.quaternion.setFromUnitVectors(_planeZ, n);
  pushGroup.add(ring);
  pushPads.set(k, ring);
}

// try to push the block at cell bk in world-direction D. Returns the new block
// cell if it moved, else null. Called when the player steps into a block.
// scratch vectors/quaternions for push-block animation
const _pbTmp = new THREE.Vector3();
const _pbQ = new THREE.Quaternion();
const _pbTmp2 = new THREE.Vector3();
const _pbQ2 = new THREE.Quaternion();
function tryPush(bk, playerCellK, D){
  try { return tryPushInner(bk, playerCellK, D); }
  catch(err){ console.error('push error:', err); return null; }
}
function tryPushInner(bk, playerCellK, D){
  const [bfi, bu, bv] = bk.split(',').map(Number);
  // The push direction D is expressed in the PLAYER's face frame. When the block
  // sits on a different face (across an edge), D isn't a valid tangent of the
  // block's face, so we can't use it directly. Instead we pick the block's exit
  // that continues the push line: the neighbour cell the player is shoving toward
  // (furthest from the player along the shove line).
  const playerPos = playerCellK ? cellToPoint(...playerCellK.split(',').map(Number)) : null;
  let dest = null, destDir = null, destSeam = null;
  if (playerPos){
    const bPos = cellToPoint(bfi, bu, bv);
    const shove = bPos.clone().sub(playerPos);   // world heading player->block
    let best = -Infinity;
    for (const [nf, nu, nv, mk, dir] of cellNeighbours(bfi, bu, bv)){
      const nPos = cellToPoint(nf, nu, nv);
      const away = nPos.clone().sub(playerPos).dot(shove);
      const score = dir.dot(shove) + away * 0.001;
      if (score > best){ best = score; dest = [nf, nu, nv]; destDir = dir.clone(); destSeam = mk; }
    }
  } else {
    dest = cellStep(bfi, bu, bv, D);
    if (dest){
      for (const [nf, nu, nv, mk, dir] of cellNeighbours(bfi, bu, bv))
        if (nf === dest[0] && nu === dest[1] && nv === dest[2]){ destDir = dir.clone(); destSeam = mk; break; }
    }
  }
  if (!dest || !destDir) return null;            // block at edge with nowhere to go
  const dk = cellKey(...dest);
  // a wall (rail) on the seam blocks the block just as it blocks the player —
  // the block can't be shoved through a wall it can't pass.
  if (destSeam && rails.has(destSeam)) return null;
  if (blocked.has(dk) || holes.has(dk) || pushBlocks.has(dk)) return null;
  const rec = pushBlocks.get(bk);
  if (rec.anim) return null;                      // already mid-push, ignore
  const [nfi, nu, nv] = dest;
  const sameFace = (nfi === bfi);
  // the block's move direction on ITS OWN face, used for the flip axis
  const bD = destDir;

  // update the LOGICAL position immediately so chained pushes and the win check
  // stay correct; the mesh catches up via the animation below.
  pushBlocks.delete(bk);
  pushBlocks.set(dk, rec);

  const fromPos = rec.mesh.position.clone();
  const fromQ = rec.mesh.quaternion.clone();
  const nN = FACES[nfi].n;
  const toPos = cellToPoint(nfi, nu, nv).addScaledVector(nN, CELL*0.41 + faceLift(nfi));
  const toQ = new THREE.Quaternion().setFromUnitVectors(_upY, nN);

  if (sameFace){
    rec.anim = { kind:'slide', t:0, dur:150, fromPos, toPos };
  } else {
    const oldN = FACES[bfi].n;
    let axis = new THREE.Vector3().crossVectors(oldN, bD);
    if (axis.lengthSq() < 1e-9){
      // degenerate — a zero axis becomes NaN and crashes WebGL. Fall back to slide.
      rec.anim = { kind:'slide', t:0, dur:180, fromPos, toPos };
      refreshPads(); updateGemHUD();
      return dk;
    }
    axis.normalize();
    const oldCentre = cellToPoint(bfi, bu, bv);
    const edgeMid = oldCentre.clone()
      .addScaledVector(bD, CELL/2)
      .addScaledVector(oldN, -CELL/2);
    const testEnd = (ang) => _pbTmp2.copy(fromPos).sub(edgeMid)
      .applyQuaternion(_pbQ2.setFromAxisAngle(axis, ang)).add(edgeMid);
    const half = Math.PI/2;
    const dPos = testEnd(half).distanceTo(toPos);
    const dNeg = testEnd(-half).distanceTo(toPos);
    const sign = dPos <= dNeg ? 1 : -1;
    const outN = oldN.clone().add(nN).normalize();    // bulge out over the edge
    rec.anim = { kind:'flip', t:0, dur:220, fromPos, fromQ, toPos, toQ, axis, edgeMid, sign, outN };
  }

  refreshPads();
  updateGemHUD();
  return dk;
}

// advance push-block animations; called each frame
function tickPushBlocks(dt){
  try {
  for (const rec of pushBlocks.values()){
    const a = rec.anim;
    if (!a) continue;
    a.t += dt;
    const raw = Math.min(1, a.t / a.dur);
    const e = raw < 0.5 ? 2*raw*raw : 1 - Math.pow(-2*raw+2, 2)/2;   // ease in-out
    if (a.kind === 'slide'){
      rec.mesh.position.lerpVectors(a.fromPos, a.toPos, e);
    } else {
      // tumble over the edge: interpolate position along an arc that bulges out
      // past the edge (so it swings over, not through the cube), while rotating
      // 90° for the roll. Exact landing is snapped at raw>=1, so the arc only
      // needs to read as a believable tumble.
      _pbTmp.lerpVectors(a.fromPos, a.toPos, e);
      // lift the midpoint outward along the average of the two face normals
      const bulge = Math.sin(e * Math.PI) * CELL * 0.33;
      _pbTmp.addScaledVector(a.outN, bulge);
      rec.mesh.position.copy(_pbTmp);
      _pbQ.setFromAxisAngle(a.axis, e * (Math.PI/2) * a.sign);
      rec.mesh.quaternion.copy(_pbQ).multiply(a.fromQ);
    }
    // NaN guard: a non-finite position/quaternion crashes the WebGL renderer
    const _p = rec.mesh.position;
    if (!Number.isFinite(_p.x) || !Number.isFinite(_p.y) || !Number.isFinite(_p.z)){
      rec.mesh.position.copy(a.toPos);
      if (a.toQ) rec.mesh.quaternion.copy(a.toQ);
      rec.anim = null;
      continue;
    }
    if (raw >= 1){
      rec.mesh.position.copy(a.toPos);
      if (a.toQ) rec.mesh.quaternion.copy(a.toQ);   // flips reorient; slides don't
      rec.anim = null;
      refreshPads();
      if (puzzleSolved()) levelComplete();
    }
  }
  } catch(err){
    console.error('push animation error:', err);
    // never let an animation glitch spam or crash: snap all to their targets
    for (const rec of pushBlocks.values()) if (rec.anim){
      rec.mesh.position.copy(rec.anim.toPos);
      if (rec.anim.toQ) rec.mesh.quaternion.copy(rec.anim.toQ);
      rec.anim = null;
    }
  }
}

// light up pads that have a block on them
function refreshPads(){
  for (const [pk, ring] of pushPads){
    const on = pushBlocks.has(pk);
    ring.material.color.setHex(on ? 0x66c7a5 : 0xe0a03a);
    ring.material.opacity = on ? 1.0 : 0.85;
  }
}

function puzzleSolved(){
  for (const pk of pushPads.keys()) if (!pushBlocks.has(pk)) return false;
  return pushPads.size > 0;
}

// ---------- keystone: the awakened monument that ends the level ----------
// When KEYSTONE is on, collecting every gem doesn't finish the level — instead
// it awakens one monument, and the player must journey to it and dwell there.
// The monument is an ordinary reachable cell (solvability already guarantees a
// path to it), so this composes without touching the movement graph.
let keystoneCell = null;     // "fi,u,v" of the chosen monument
let keystoneGroup = null;    // its mesh group, for the awaken glow
let keystoneAwake = false;
let keystoneCharge = 0;      // dwell progress 0..1
let keystoneBeacon = null;   // the light column shown when awake
const KEYSTONE_DWELL = 500;

function awakenKeystone(){
  if (keystoneAwake || !keystoneCell) return;
  keystoneAwake = true;
  const [fi, u, v] = keystoneCell.split(',').map(Number);
  const n = FACES[fi].n;
  const base = cellToPoint(fi, u, v);
  // a rising column of warm light so it calls to you across the surface
  const col = new THREE.Color(0xffd98a);
  const geo = new THREE.CylinderGeometry(CELL*0.18, CELL*0.42, CELL*3.2, 5, 1, true);
  const mat = new THREE.MeshBasicMaterial({
    color: col, transparent:true, opacity:0.0,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
  keystoneBeacon = new THREE.Mesh(geo, mat);
  keystoneBeacon.position.copy(base).addScaledVector(n, CELL*1.6);
  keystoneBeacon.quaternion.setFromUnitVectors(_upY, n);
  levelGroup.add(keystoneBeacon);
  const light = new THREE.PointLight(0xffd98a, 0, 4, 2);
  light.position.copy(base).addScaledVector(n, CELL*0.8);
  levelGroup.add(light);
  keystoneBeacon.userData.light = light;
  if (keystoneGroup && keystoneGroup.userData.mark){
    keystoneGroup.userData.mark.material.emissive.setHex(0xffb060);
  }
  if (keystoneGroup && keystoneGroup.userData.dormant){
    keystoneGroup.userData.dormant.visible = false;   // bright beacon takes over
  }
  sfxBell(392, 1.4, 0.2);                     // a low chime: the way is open
  setTimeout(() => sfxBell(587.33, 1.6, 0.2), 140);
  updateGemHUD();
  drawTrail();
}

function tickKeystone(dt){
  // gently breathe the dormant shrine so it's spottable before it wakes
  if (keystoneGroup && !keystoneAwake && keystoneGroup.userData.dormant){
    const t = performance.now() * 0.001;
    keystoneGroup.userData.dormant.material.opacity = 0.12 + 0.10*Math.sin(t*1.5);
    keystoneGroup.userData.dormant.rotation.y += 0.005;
  }
  if (!keystoneBeacon) return;
  const t = performance.now() * 0.001;
  const pulse = 0.6 + 0.4*Math.sin(t*2);
  const on = 0.35 + keystoneCharge * 0.5;
  keystoneBeacon.material.opacity = on * pulse;
  keystoneBeacon.userData.light.intensity = (0.6 + keystoneCharge*1.5) * pulse;
  keystoneBeacon.rotation.y += 0.01;
  // are we standing on the keystone?
  if (state === 'idle' && phase === 'play'){
    const fi = faceIndexOf(Nf);
    const c = pointToCell(fi, P);
    if (cellKey(fi, c.u, c.v) === keystoneCell){
      keystoneCharge = Math.min(1, keystoneCharge + dt/KEYSTONE_DWELL);
      if (keystoneCharge >= 1) levelComplete();
    } else {
      keystoneCharge = Math.max(0, keystoneCharge - dt/250);
    }
  }
}

// ---------- GAUNTLET: path-first gated puzzle generation ----------
// Instead of filling randomly then checking solvability, we DESIGN the solution
// first: carve one winding critical path from start to goal, then hang the
// mechanics (one-way runs, mandatory portal bridges, tunnels) ONTO that path so
// they're load-bearing — the route only works if you use them. Everything off
// the path is walled into dead-ends and escapable traps to hide the route.

// geometric neighbours of a cell: [nf, nu, nv, seamKey, dir] for each of 4 sides
function cellNeighbours(fi, u, v){
  const out = [];
  const n = FACES[fi].n, [ta, tb] = basisOf(n);
  const P0 = cellToPoint(fi, u, v);
  const tmp = new THREE.Vector3();
  for (const base of [ta, tb]) for (const s of [1, -1]){
    const d = base.clone().multiplyScalar(s);
    const mk = railKey(tmp.copy(P0).addScaledVector(d, CELL/2));
    const cand = P0.clone().addScaledVector(d, CELL);
    const inside =
      Math.abs(cand.dot(ta)) <= H - CELL/2 + 1e-4 &&
      Math.abs(cand.dot(tb)) <= H - CELL/2 + 1e-4;
    let nf, cc;
    if (inside){ nf = fi; cc = pointToCell(fi, cand); }
    else {
      const toP = P0.clone().addScaledVector(d, CELL/2).addScaledVector(n, -CELL/2);
      nf = faceIndexOf(d); cc = pointToCell(nf, toP);
    }
    out.push([nf, cc.u, cc.v, mk, d.clone()]);
  }
  return out;
}

function generateGauntlet(){
  const startCell = [2, 2, 2];
  const startK = cellKey(...startCell);
  // ---- Phase 1: carve the spine as a SELF-AVOIDING WALK WITH SPACING ----
  // The corridor may never touch itself: each new cell's other neighbours must
  // be off-path. That keeps every fold separated by stone, so the route reads
  // as thin winding corridors, not open plazas (the bug behind empty regions —
  // a plain DFS path folds onto itself and merges into wide open areas, and its
  // endpoint can sit right beside the start despite being 'deep').
  const targetLen = Math.min(18 + (level >> 1), 30);
  let best = null;
  for (let attempt = 0; attempt < 14; attempt++){
    const path = [startCell];
    const onPath = new Set([startK]);
    let guard = 0;
    while (path.length < targetLen && guard++ < 400){
      const cur = path[path.length - 1];
      const curK = cellKey(...cur);
      const opts = cellNeighbours(...cur).filter(([nf, nu, nv]) => {
        const ck = cellKey(nf, nu, nv);
        if (onPath.has(ck)) return false;
        // spacing rule: the candidate may touch the path ONLY at the current cell
        for (const [mf, mu, mv] of cellNeighbours(nf, nu, nv)){
          const mk = cellKey(mf, mu, mv);
          if (mk !== curK && onPath.has(mk)) return false;
        }
        return true;
      });
      if (!opts.length) break;                 // dead-ended; this attempt is done
      const [nf, nu, nv] = opts[(Math.random()*opts.length)|0];
      path.push([nf, nu, nv]);
      onPath.add(cellKey(nf, nu, nv));
    }
    // prefer walks that are long AND end on a different face (spatially far)
    const endFace = path[path.length - 1][0];
    const score = path.length + (endFace !== startCell[0] ? 12 : 0);
    if (!best || score > best.score) best = { path, score };
    if (best.path.length >= targetLen && best.path[best.path.length-1][0] !== startCell[0]) break;
  }
  const path = best.path;
  const goalCell = path[path.length - 1];
  // spine segments {from, cell, dir} for the gating pass
  const spine = [];
  for (let i = 1; i < path.length; i++){
    const from = cellKey(...path[i-1]), cell = cellKey(...path[i]);
    spine.push({ from, cell, dir: dirBetween(from, cell) });
  }
  gauntletSpine = new Set(path.map(c => cellKey(...c)));

  // ---- Phase 2: the OPEN set — spine plus decoy corridors — stays walkable;
  // every other cell becomes a masonry stack, so the path winds through solid
  // stone rather than between thin walls. Same material world as Classic.
  const open = new Set(gauntletSpine);

  // decoy corridors: short dead-end branches off the spine, carved as open cells
  // into the stone so the true route isn't obvious. A few become one-way traps.
  const decoyMouths = [];                       // {cell, dir} for trap one-ways
  const branchCount = Math.min(8 + (level >> 2), 14);   // capped: keep ~75% stone
  let made = 0, guard = 0;
  while (made < branchCount && guard++ < 300){
    const anchor = spine[(Math.random()*spine.length)|0].cell;
    let cur = anchor.split(',').map(Number);
    let curK = anchor;
    const len = 1 + (Math.random()*3|0);
    const branch = [];
    for (let step = 0; step < len; step++){
      const opts = cellNeighbours(...cur).filter(([nf,nu,nv]) => {
        const ck = cellKey(nf,nu,nv);
        if (open.has(ck) || branch.includes(ck)) return false;
        // spacing: the branch cell may touch open cells ONLY at its parent, so
        // decoys stay thin corridors and never merge into plazas
        for (const [mf,mu,mv] of cellNeighbours(nf,nu,nv)){
          const mk = cellKey(mf,mu,mv);
          if (mk !== curK && (open.has(mk) || branch.includes(mk))) return false;
        }
        return true;
      });
      if (!opts.length) break;
      const [nf,nu,nv] = opts[(Math.random()*opts.length)|0];
      const ck = cellKey(nf,nu,nv);
      open.add(ck); branch.push(ck);
      cur = [nf,nu,nv]; curK = ck;
    }
    if (branch.length){
      made++;
      // occasionally a commit-in trap: the one-way sits on the branch's FIRST
      // cell pointing deeper, so entering commits you (respawn to escape) —
      // never on the spine anchor, which would sever the main route itself
      if (branch.length >= 2 && Math.random() < 0.3){
        const d = dirBetween(branch[0], branch[1]);
        if (d) decoyMouths.push({ cell: branch[0], dir: d });
      }
    }
  }

  // ---- Phase 2b: gate the spine with one-way runs — only if the ONE-WAY TILES
  // feature is switched on in the lab. Off => a pure masonry-block maze.
  if (featureOn('oneways')){
    gateSpine(spine, startCell, goalCell);
    for (const { cell, dir } of decoyMouths){
      if (!oneways.has(cell)) oneways.set(cell, dir);
    }
  }

  // ---- Phase 3: stack every non-open cell as masonry ----
  const mode = MODE();
  for (let fi = 0; fi < 6; fi++)
    for (let u = 0; u < N; u++)
      for (let v = 0; v < N; v++){
        const ck = cellKey(fi, u, v);
        if (open.has(ck)) continue;
        // vary heights a little for a ruined skyline; 1-2 high
        const h = 1 + (cellHash(fi, u, v, 71) < 0.35 ? 1 : 0);
        addStack(fi, u, v, h, false);
      }

  // set the goal BEFORE the feature pass so every generator knows to avoid it
  finishKey = cellKey(...goalCell);

  // ---- Phase 4: weave the lab's obstacle features into the corridors ----
  // Each generator already skips blocked cells and carries a connectivity
  // guard, so here they confine themselves to the open corridors and can only
  // decorate the maze, never sever it. The goal cell is explicitly protected.
  // Portals are confined to the DECOY branches: in the movement graph a portal
  // cell inherits its partner's exits, so one sitting mid-spine would muddy the
  // route's reachability — off-spine they're shortcuts between false corridors.
  for (const fk of ['towers', 'rails', 'holes', 'bridges'])
    if (featureOn(fk) && FEATURES[fk].gen) FEATURES[fk].gen();
  if (featureOn('portals') && FEATURES.portals.gen){
    for (const s of gauntletSpine) blocked.add(s);    // shield the spine
    FEATURES.portals.gen();
    for (const s of gauntletSpine) blocked.delete(s);
  }

  placeGauntletGoal(goalCell);
  // self-check: confirm the goal is directed-reachable from the start. The
  // corridor is defined by open cells (stacks seal the rest), so the only thing
  // that can strand the goal is an unlucky one-way; clearing them restores the
  // fully-traversable spine. Proven not to trigger in simulation, but kept as a
  // guarantee against any edge case.
  if (!goalReachable()){
    oneways.clear();
    onewayMeshes.length = 0;
  }
}

// is the finish reachable from the start through the current directed graph?
function goalReachable(){
  if (!finishKey) return true;
  const seen = new Set([cellKey(2,2,2)]);
  const q = [[2,2,2]];
  for (let h = 0; h < q.length; h++){
    const [a,b,c] = q[h];
    if (cellKey(a,b,c) === finishKey) return true;
    for (const [nf,nu,nv] of neighborsOf(a,b,c)){
      const k = cellKey(nf,nu,nv);
      if (seen.has(k) || blocked.has(k) || holes.has(k)) continue;
      seen.add(k); q.push([nf,nu,nv]);
    }
  }
  return seen.has(finishKey);
}

// hang mechanics on the spine so traversal REQUIRES them. Safe by construction:
// one-ways point along the path (never blocking the intended direction), and
// portals bridge gaps we simultaneously wall off, so they're the only crossing.
function gateSpine(spine, startCell, goalCell){
  const L = spine.length;
  if (L < 6) return;                          // too short to gate meaningfully

  // ONE-WAY RUNS: a few short committed stretches — accents on the route, not
  // wallpaper. Runs point along the path (toward the goal), always solvable.
  const runs = 2 + (level >> 2);              // 2-4 runs typically
  let guard = 0;
  for (let r = 0; r < runs && guard < 60; r++){
    guard++;
    const runLen = 2 + (Math.random()*2|0);   // 2-3 cells each
    const startI = 1 + (Math.random() * Math.max(1, L - runLen - 2) | 0);
    for (let i = startI; i < startI + runLen && i < L; i++){
      const seg = spine[i];
      if (seg && !oneways.has(seg.from)){
        oneways.set(seg.from, seg.dir.clone());
      }
    }
  }

  // PORTAL BRIDGES: deferred pending correct gap-crossing generation.
}

// world-direction from cell A to adjacent cell B (or null if not adjacent)
function dirBetween(aKey, bKey){
  const [afi, au, av] = aKey.split(',').map(Number);
  for (const [nf, nu, nv, , dir] of cellNeighbours(afi, au, av)){
    if (cellKey(nf, nu, nv) === bKey) return dir.clone();
  }
  return null;
}

function placeGauntletGoal(goalCell){
  const [fi, u, v] = goalCell;
  const pos = cellToPoint(fi, u, v);
  const tile = new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.8, CELL*0.8),
    new THREE.MeshBasicMaterial({ color:0x66c7a5 }));
  tile.position.copy(pos).addScaledVector(FACES[fi].n, 0.015);
  tile.quaternion.setFromUnitVectors(_planeZ, FACES[fi].n);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(CELL*0.18, CELL*0.5, 4),
    new THREE.MeshLambertMaterial({ color:0x66c7a5, emissive:0x1f5f49, emissiveIntensity:0.6 }));
  cone.position.copy(pos).addScaledVector(FACES[fi].n, CELL*0.3);
  cone.quaternion.setFromUnitVectors(_upY, FACES[fi].n);
  levelGroup.add(tile, cone);
}

// ---------- maze mode: one perfect maze over the whole surface ----------
// Start with every seam walled (cube edges included), then carve a randomized
// depth-first spanning tree over all 216 cells. Result: every cell reachable,
// exactly one route between any two — the strongest solvability guarantee
// there is. Remaining walls become rails.
let finishKey = null;

function generateMaze(){
  const dirs = ['+u','-u','+v','-v'];
  const tmp = new THREE.Vector3();
  // enumerate every seam, keyed by midpoint (shared seams collapse, even
  // across cube edges) with one representative (face, cell, dir) for the mesh
  const wall = new Map();
  for (let fi = 0; fi < 6; fi++){
    const [ta, tb] = basisOf(FACES[fi].n);
    for (let u = 0; u < N; u++) for (let v = 0; v < N; v++){
      const c = cellToPoint(fi, u, v);
      for (const d of dirs){
        const ax = (d[1]==='u' ? ta : tb).clone().multiplyScalar(d[0]==='+' ? 1 : -1);
        const mk = railKey(tmp.copy(c).addScaledVector(ax, CELL/2));
        if (!wall.has(mk)) wall.set(mk, [fi, u, v, d]);
      }
    }
  }
  // randomized DFS carve from the start cell
  const visited = new Set([cellKey(2,2,2)]);
  const stack = [[2,2,2]];
  while (stack.length){
    const [fi, u, v] = stack[stack.length - 1];
    const n = FACES[fi].n, [ta, tb] = basisOf(n);
    const P0 = cellToPoint(fi, u, v);
    const opts = [];
    for (const base of [ta, tb]) for (const s of [1, -1]){
      const d = base.clone().multiplyScalar(s);
      const mk = railKey(tmp.copy(P0).addScaledVector(d, CELL/2));
      const cand = P0.clone().addScaledVector(d, CELL);
      const inside =
        Math.abs(cand.dot(ta)) <= H - CELL/2 + 1e-4 &&
        Math.abs(cand.dot(tb)) <= H - CELL/2 + 1e-4;
      let nf, cc;
      if (inside){ nf = fi; cc = pointToCell(fi, cand); }
      else {
        const toP = P0.clone().addScaledVector(d, CELL/2).addScaledVector(n, -CELL/2);
        nf = faceIndexOf(d); cc = pointToCell(nf, toP);
      }
      if (!visited.has(cellKey(nf, cc.u, cc.v))) opts.push([nf, cc.u, cc.v, mk]);
    }
    if (!opts.length){ stack.pop(); continue; }
    const [nf, nu, nv, mk] = opts[(Math.random()*opts.length)|0];
    wall.delete(mk);                                   // carve the passage
    visited.add(cellKey(nf, nu, nv));
    stack.push([nf, nu, nv]);
  }
  // register every wall key first, THEN build meshes — the end-context checks
  // (mitre vs flat) need to see the complete layout
  for (const mk of wall.keys()) rails.add(mk);
  for (const [, [fi, u, v, d]] of wall) addRail(fi, u, v, d);
}

// the finish sits at the farthest cell from the start along the maze
function placeReachGoal(){
  const dist = bfsFrom(2, 2, 2);
  let bk = null, bd = -1;
  for (const [k, d] of dist) if (d > bd){ bd = d; bk = k; }
  finishKey = bk;
  const [fi, u, v] = bk.split(',').map(Number);
  const pos = cellToPoint(fi, u, v);
  const tile = new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.8, CELL*0.8),
    new THREE.MeshBasicMaterial({ color:0x66c7a5 }));
  tile.position.copy(pos).addScaledVector(FACES[fi].n, 0.015);
  tile.quaternion.setFromUnitVectors(_planeZ, FACES[fi].n);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(CELL*0.18, CELL*0.5, 4),
    new THREE.MeshLambertMaterial({ color:0x66c7a5, emissive:0x1f5f49, emissiveIntensity:0.6 }));
  cone.position.copy(pos).addScaledVector(FACES[fi].n, CELL*0.3);
  cone.quaternion.setFromUnitVectors(_upY, FACES[fi].n);
  levelGroup.add(tile, cone);
}

// ---------- see through: fade whatever hides the player ----------
// A raycast from the camera to the player each frame. Anything it hits on the
// way fades out; everything else fades back. Works for any obstacle type —
// towers, tunnels, wall fins — without special-casing them.
const occRay = new THREE.Raycaster();
const occFaded = new Map();      // mesh -> { mat, target }
const _occFrom = new THREE.Vector3(), _occTo = new THREE.Vector3(), _occDir = new THREE.Vector3();
const _occUp = new THREE.Vector3(0, 1, 0);

function updateSeeThrough(dt){
  const on = featureOn('seeThrough');
  const hitNow = new Set();
  if (on && levelGroup && phase === 'play'){
    _occTo.copy(player.position);
    world.localToWorld(_occTo);                       // player is a child of world
    // orthographic view: cast from a point offset back along the view direction
    _occDir.copy(camera.position).normalize();
    const back = _occDir.clone().negate();
    // a spread of rays across the player's silhouette, so a block clipping its
    // edge fades too rather than only dead-centre hits
    const rx = new THREE.Vector3().crossVectors(_occDir, _occUp).normalize();
    const ry = new THREE.Vector3().crossVectors(rx, _occDir).normalize();
    const r = PSIZE * 0.5;
    const offs = [[0,0], [r,0], [-r,0], [0,r], [0,-r]];
    for (const [ox, oy] of offs){
      _occFrom.copy(_occTo).addScaledVector(rx, ox).addScaledVector(ry, oy)
              .addScaledVector(_occDir, 60);
      occRay.set(_occFrom, back);
      occRay.far = 60 - 0.6;                          // stop just short of the player
      const hits = occRay.intersectObjects(levelGroup.children, false);
      for (const h of hits){
        const m = h.object;
        if (!m.isMesh || !m.material) continue;
        // only solid obstacles: skip additive glow planes and anything already transparent
        if (m.material.blending === THREE.AdditiveBlending) continue;
        if (m.material.transparent && !occFaded.has(m)) continue;
        hitNow.add(m);
        if (!occFaded.has(m)){
          // materials are shared between meshes — clone so only this one fades
          const mat = m.material.clone();
          mat.transparent = true;
          m.userData._origMat = m.material;
          m.material = mat;
          occFaded.set(m, { mat, target: 0 });
        }
        occFaded.get(m).target = 1;
      }
    }
  }
  // ease every tracked mesh toward its target, restoring finished ones
  const fade = FEATURES.seeThrough.slider.value / 100;
  const k = 1 - Math.exp(-9 * dt / 1000);
  for (const [m, rec] of occFaded){
    if (!hitNow.has(m)) rec.target = 0;
    const want = rec.target ? fade : 1;
    rec.mat.opacity += (want - rec.mat.opacity) * k;
    if (rec.target === 0 && rec.mat.opacity > 0.995){
      // fully restored — hand the shared material back and drop the clone
      if (m.userData._origMat) m.material = m.userData._origMat;
      rec.mat.dispose();
      occFaded.delete(m);
    }
  }
}
function clearSeeThrough(){
  for (const [m, rec] of occFaded){
    if (m.userData._origMat) m.material = m.userData._origMat;
    rec.mat.dispose();
  }
  occFaded.clear();
}

// ---------- solution trail: the route, drawn as breadcrumbs ----------
// The pathfinding already exists (the clock is sized from it) — this just
// renders it. BFS with parent links so a route can be walked back.
function bfsPaths(fi, u, v){
  const start = cellKey(fi,u,v);
  const dist = new Map([[start, 0]]);
  const prev = new Map();
  const q = [[fi,u,v]];
  for (let h = 0; h < q.length; h++){
    const [a,b,c] = q[h];
    const kFrom = cellKey(a,b,c);
    for (const [nf,nu,nv] of neighborsOf(a,b,c)){
      const k = cellKey(nf,nu,nv);
      if (dist.has(k) || blocked.has(k) || holes.has(k)) continue;
      dist.set(k, dist.get(kFrom) + 1);
      prev.set(k, kFrom);
      q.push([nf,nu,nv]);
    }
  }
  return { dist, prev };
}
function tracePath(prev, target){
  const out = [];
  let k = target;
  while (k !== undefined){ out.push(k); k = prev.get(k); }
  return out.reverse();
}

// the route from where the player stands: the exit in maze mode, otherwise a
// greedy tour through whatever gems remain
function computeRoute(){
  const fi = faceIndexOf(Nf);
  const c = pointToCell(fi, P);
  let cur = [fi, c.u, c.v];
  const route = [];
  // keystone awake: the goal is the keystone, not the gems (they're all gone)
  if (keystoneAwake && keystoneCell){
    const { prev } = bfsPaths(cur[0], cur[1], cur[2]);
    return tracePath(prev, keystoneCell);
  }
  if (isGoalObjective()){
    if (!finishKey) return route;
    const { prev } = bfsPaths(cur[0], cur[1], cur[2]);
    return tracePath(prev, finishKey);
  }
  const left = gems.filter(g => !g.taken);
  let guard = 0;
  while (left.length && guard++ < 40){
    const { dist, prev } = bfsPaths(cur[0], cur[1], cur[2]);
    let bi = -1, bd = Infinity;
    for (let i = 0; i < left.length; i++){
      const gc = pointToCell(left[i].face, left[i].pos);
      const d = dist.get(cellKey(left[i].face, gc.u, gc.v));
      if (d !== undefined && d < bd){ bd = d; bi = i; }
    }
    if (bi < 0) break;
    const g = left.splice(bi, 1)[0];
    const gc = pointToCell(g.face, g.pos);
    const leg = tracePath(prev, cellKey(g.face, gc.u, gc.v));
    route.push(...(route.length ? leg.slice(1) : leg));
    cur = [g.face, gc.u, gc.v];
  }
  return route;
}

const trailGroup = new THREE.Group();
world.add(trailGroup);
const dotGeo = new THREE.SphereGeometry(CELL*0.09, 10, 8);
const dots = [];
function clearTrail(){
  for (const d of dots) trailGroup.remove(d.mesh);
  dots.length = 0;
}
function drawTrail(){
  clearTrail();
  if (!featureOn('solution') || phase !== 'play') return;
  const route = computeRoute();
  route.forEach((k, i) => {
    if (i === 0) return;                       // skip the cell we're standing on
    const [fi, u, v] = k.split(',').map(Number);
    // a portal on the route is a deliberate hop, not a walk-through — mark it
    const isPortal = portals.has(k);
    const mesh = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({
      color: isPortal ? 0xffffff : 0x5c4a5e, transparent:true, opacity:0.5 }));
    mesh.position.copy(cellToPoint(fi, u, v))
      .addScaledVector(FACES[fi].n, CELL*0.22 + faceLift(fi));
    if (isPortal) mesh.scale.setScalar(1.6);
    trailGroup.add(mesh);
    dots.push({ mesh, i, base: isPortal ? 1.6 : 1 });
  });
}

// ---------- fairness: measure the level, derive the clock ----------
// BFS step-distances over the real walkable graph (rails sever seams,
// holes are impassable for routing — falling in is not a route).
function bfsFrom(fi, u, v){
  const dist = new Map([[cellKey(fi,u,v), 0]]);
  const q = [[fi,u,v]];
  for (let h = 0; h < q.length; h++){
    const [a,b,c] = q[h];
    const d0 = dist.get(cellKey(a,b,c));
    for (const [nf,nu,nv] of neighborsOf(a,b,c)){
      const k = cellKey(nf,nu,nv);
      if (dist.has(k) || blocked.has(k) || holes.has(k)) continue;
      dist.set(k, d0 + 1);
      q.push([nf,nu,nv]);
    }
  }
  return dist;
}

// failsafe: if a gem is somehow unreachable, move it to a reachable cell
function relocateGem(g, dist){
  const keys = [...dist.keys()].filter(k => k !== cellKey(2,2,2));
  const k = keys[(Math.random()*keys.length)|0];
  const [fi,u,v] = k.split(',').map(Number);
  g.face = fi;
  g.pos = cellToPoint(fi, u, v);
  g.mesh.quaternion.setFromUnitVectors(_upY, FACES[fi].n);
}

// greedy nearest-neighbour tour through all gems: a solid upper-ish bound on
// the walking the level actually demands
function shortestTour(){
  let cur = [2,2,2];
  const remaining = gems.slice();
  let steps = 0, guard = 0;
  while (remaining.length && guard++ < 40){
    const dist = bfsFrom(cur[0], cur[1], cur[2]);
    let bi = -1, bd = Infinity;
    for (let i = 0; i < remaining.length; i++){
      const c = pointToCell(remaining[i].face, remaining[i].pos);
      const d = dist.get(cellKey(remaining[i].face, c.u, c.v));
      if (d !== undefined && d < bd){ bd = d; bi = i; }
    }
    if (bi < 0){ relocateGem(remaining[0], dist); continue; }
    steps += bd;
    const g = remaining.splice(bi, 1)[0];
    const c = pointToCell(g.face, g.pos);
    cur = [g.face, c.u, c.v];
  }
  return steps;
}

// the clock is derived from the measured tour: always beatable, with a slack
// margin that tightens as levels climb — difficulty without impossibility
function fairTimeLimit(){
  let steps;
  if (isGoalObjective() && finishKey){
    steps = bfsFrom(2,2,2).get(finishKey) || 80;       // the one true path
  } else {
    steps = shortestTour();
  }
  const perStep = 0.42;                              // seconds per step, decent pace
  const slack = Math.max(1.15, 1.8 - level * 0.07);
  return Math.max(20, Math.ceil(steps * perStep * slack) + 6);
}

// ---------- HUD ----------

// ---------- sound: wood, bells and breath, all synthesised ----------
// No samples — keeps the game a single self-contained file, and pure synthesis
// suits the geometric abstraction better than recorded foley would.
let actx = null, masterGain = null, droneGain = null, noiseBuf = null;
function audio(){
  if (!featureOn('sound') && !featureOn('drone')) return null;
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    masterGain = actx.createGain();      // sound effects
    masterGain.connect(actx.destination);
    droneGain = actx.createGain();       // the pad, on its own fader
    droneGain.connect(actx.destination);
    // shared noise buffer for the wood and breath voices
    const n = actx.sampleRate * 0.5;
    noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  masterGain.gain.value = featureOn('sound')
    ? FEATURES.sound.slider.value / 100 * 0.5 : 0;
  droneGain.gain.value = featureOn('drone')
    ? FEATURES.drone.slider.value / 100 * 0.35 : 0;
  return actx;
}

// a filtered noise burst — the wood-block family (steps, thuds, bumps)
function sfxWood(freq, dur, gain, q){
  if (!featureOn('sound')) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q || 6;
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + dur + 0.02);
}

// detuned inharmonic partials through a soft lowpass — the bell family.
// Real bells aren't integer harmonics; the slight detune gives gentle beating.
function sfxBell(freq, dur, gain){
  if (!featureOn('sound')) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(Math.min(6000, freq * 7), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(400, freq * 1.6), t + dur);
  lp.Q.value = 0.6;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  lp.connect(g); g.connect(masterGain);
  // partial, amplitude, decay scale, detune cents — higher partials die sooner
  const parts = [
    [1.00, 1.00, 1.00,  0],
    [2.01, 0.42, 0.72, +3],
    [2.76, 0.22, 0.55, -4],
    [3.94, 0.12, 0.40, +6],
    [5.42, 0.06, 0.28, -7],
  ];
  for (const [mult, amp, dscale, cents] of parts){
    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq * mult;
    o.detune.value = cents;
    const og = ac.createGain();
    og.gain.setValueAtTime(amp, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + dur * dscale);
    o.connect(og); og.connect(lp);
    o.start(t); o.stop(t + dur + 0.05);
  }
  // a soft strike transient so it has a body, not just a tone
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = freq * 2; bp.Q.value = 1.5;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(gain * 0.25, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  src.connect(bp); bp.connect(ng); ng.connect(masterGain);
  src.start(t); src.stop(t + 0.08);
}

// a filtered noise sweep — the breath family (flips, swivels, portals)
function sfxBreath(f0, f1, dur, gain){
  if (!featureOn('sound')) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 2.5;
  bp.frequency.setValueAtTime(f0, t);
  bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + dur*0.25);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + dur + 0.02);
}

// a swept chorus through a moving filter — portals in/out. Three detuned
// voices plus a fifth give it body; the filter follows the pitch so it
// blooms rather than whistles.
function sfxSweep(f0, f1, dur, gain, type){
  if (!featureOn('sound')) return;
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(f0 * 4, t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(200, f1 * 4), t + dur);
  lp.Q.value = 1.2;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + dur * 0.15);
  g.gain.setValueAtTime(gain, t + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  lp.connect(g); g.connect(masterGain);
  // voice: pitch multiplier, amplitude, detune cents
  const voices = [[1, 1, -6], [1, 0.9, +7], [1.5, 0.35, +2], [0.5, 0.5, -3]];
  for (const [mult, amp, cents] of voices){
    const o = ac.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0 * mult, t);
    o.frequency.exponentialRampToValueAtTime(f1 * mult, t + dur);
    o.detune.value = cents;
    const og = ac.createGain(); og.gain.value = amp;
    o.connect(og); og.connect(lp);
    o.start(t); o.stop(t + dur + 0.05);
  }
  // a breath of air under the sweep so it feels like passage, not just tone
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 1.8;
  bp.frequency.setValueAtTime(f0 * 1.5, t);
  bp.frequency.exponentialRampToValueAtTime(Math.max(120, f1 * 1.5), t + dur);
  const ng = ac.createGain();
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(gain * 0.4, t + dur * 0.3);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(ng); ng.connect(masterGain);
  src.start(t); src.stop(t + dur + 0.05);
}

// ---------- the drone: a slow pad in C, the key the gems ring in ----------
// Everything else is tuned to this — the gem scale is C pentatonic and the
// portal notes are drawn from it, so collection phrases land consonant
// against the bed rather than fighting it.
let drone = null;
function startDrone(){
  const ac = audio(); if (!ac || drone) return;
  const t = ac.currentTime;
  const out = ac.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(1, t + 4);        // fade in slowly
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 0.7;
  lp.connect(out); out.connect(droneGain);
  // a slow filter sweep so the pad breathes
  const lfo = ac.createOscillator();
  lfo.type = 'sine'; lfo.frequency.value = 0.045;
  const lfoAmt = ac.createGain(); lfoAmt.gain.value = 260;
  lfo.connect(lfoAmt); lfoAmt.connect(lp.frequency);
  lfo.start(t);
  const voices = [];
  // C2 root, C3 octave, G3 fifth, C4 — an open, unresolved stack
  const notes = [65.41, 130.81, 196.00, 261.63];
  const amps  = [0.30, 0.20, 0.13, 0.07];
  notes.forEach((f, i) => {
    // two detuned oscillators per note: slow beating gives it life
    for (const cents of [-5, +5]){
      const o = ac.createOscillator();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = f;
      o.detune.value = cents;
      const g = ac.createGain(); g.gain.value = amps[i] * 0.5;
      o.connect(g); g.connect(lp);
      o.start(t);
      voices.push(o);
    }
  });
  // a distant shimmer riding on top
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.8;
  const ng = ac.createGain(); ng.gain.value = 0.012;
  const nlfo = ac.createOscillator();
  nlfo.type = 'sine'; nlfo.frequency.value = 0.07;
  const nAmt = ac.createGain(); nAmt.gain.value = 0.008;
  nlfo.connect(nAmt); nAmt.connect(ng.gain);
  nlfo.start(t);
  src.connect(bp); bp.connect(ng); ng.connect(out);
  src.start(t);
  drone = { out, voices, extra: [lfo, nlfo, src] };
}
function stopDrone(){
  if (!drone || !actx) return;
  const t = actx.currentTime;
  drone.out.gain.cancelScheduledValues(t);
  drone.out.gain.setValueAtTime(drone.out.gain.value, t);
  drone.out.gain.linearRampToValueAtTime(0, t + 1.2);
  for (const o of drone.voices) o.stop(t + 1.4);
  for (const o of drone.extra) o.stop(t + 1.4);
  drone = null;
}

// ---------- level lifecycle ----------
const START_LEVEL = 25;
let level = START_LEVEL;
let timeLeft = 0;
let phase = 'menu'; // 'menu' | 'play' | 'wait'
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
function showOverlay(text){ overlayText.textContent = text; overlay.style.opacity = 1; }
function hideOverlay(){ overlay.style.opacity = 0; }

function buildLevel(){
  clearSeeThrough();
  if (levelGroup) world.remove(levelGroup);
  levelGroup = new THREE.Group();
  world.add(levelGroup);
  blocked.clear(); rails.clear(); pathFaces.clear(); pathCells.clear(); holes.clear(); holeList.length = 0; bridged.clear();
  oneways.clear(); onewayMeshes.length = 0;
  gauntletSpine = null; gauntletWallSeams.clear(); wallRep.clear();
  clearPushPuzzle();
  portals.clear(); portalList.length = 0; portalFX.clear();
  gems.length = 0; gemCount = 0;
  monumentCells.length = 0;
  keystoneCell = null; keystoneGroup = null; keystoneAwake = false;
  keystoneCharge = 0; keystoneBeacon = null;

  const mode = MODE();
  finishKey = null;
  const obj = mode.objective;

  // ONE shared layout for every objective: run all the lab's gen() hooks so the
  // board is the open, breathable Classic layout — sparse blocks, monuments,
  // negative space — regardless of objective. (maze/walls-only is retired; the
  // open board is nicer and every objective inherits every dynamic.)
  for (const k of Object.keys(FEATURES))
    if (FEATURES[k].on && FEATURES[k].gen) FEATURES[k].gen();

  // the objective layer: what you place on top, and what winning means
  if (obj === 'collect'){
    gemsTotal = spawnGems(Math.min(4 + level, 12));
    if (featureOn('keystone')) placeKeystone();
  } else if (obj === 'reach'){
    // a single goal on a far reachable cell — the open board becomes a journey
    gemsTotal = 0;
    placeReachGoal();
  } else if (obj === 'puzzle'){
    // Sokoban-style state puzzle: push blocks onto target pads. Winning is a
    // CONFIGURATION (every block on a pad), not reaching a point — the board
    // has state, and you change it by pushing. Lives on the same open board.
    gemsTotal = 0;
    placePushPuzzle();
  }
  updateFaceTextures();   // cut any hole openings out of the face surfaces
  timeLeft = fairTimeLimit();

  world.quaternion.set(0,0,0,1);
  P.copy(cellToPoint(2, 2, 2));
  Nf.copy(FACES[2].n);
  player.quaternion.copy(playerTargetQuat());
  state = 'idle'; tw = null; peeked = false; portalArmed = null; autoPush = null;
  camMove = null;
  skewSign = 1; skewCur = skewTarget(); elevCur = elevTarget(); applyCamera();

  levelChip.textContent = mode.name + ' \u00b7 ' + level;
  lvlNum.textContent = level;
  timeChip.style.display = timerActive() ? '' : 'none';
  drawOneways();
  updateFaceHUD(); updateGemHUD(); updateTimeHUD();
  applyShadows();
  drawTrail();
}

// falling into a hole: sink, shrink, and reappear at the start cell
function startFall(){
  state = 'fall';
  sfxSweep(300, 70, 0.5, 0.16, 'sine');     // down we go
  tw = { t:0, dur:550, c0:player.position.clone(), n:Nf.clone() };
}
function respawn(){
  sfxWood(90, 0.18, 0.45, 2);               // the thud at the bottom
  player.scale.setScalar(1);
  world.quaternion.set(0,0,0,1);
  P.copy(cellToPoint(2, 2, 2));
  Nf.copy(FACES[2].n);
  player.quaternion.copy(playerTargetQuat());
  tw = null; state = 'idle';
  updateFaceHUD();
  placePlayer(P);
  drawTrail();
}

// stepping into a portal: sink into the shaft, then rise out of the partner
// while the cube rotates to bring the destination face up into view
// Stepping onto a portal doesn't take you immediately: it arms a short dwell.
// Keep moving and you cross straight over; linger and it pulls you through.
// A portal is a choice, not a trap.
const PORTAL_DWELL = 420;
let portalArmed = null;      // { key, t }
let autoPush = null;         // { dir, t } — pending one-way forward push

// a rising tone while the player dwells on a portal — cut short if they leave
let chargeVoice = null;
function startChargeTone(key){
  if (!featureOn('sound')) return;
  const ac = audio(); if (!ac) return;
  stopChargeTone();
  const fx = portalFX.get(key);
  const n = fx && fx.note ? fx.note : 440;
  const t = ac.currentTime, dur = PORTAL_DWELL/1000;
  const o = ac.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(n * 0.75, t);
  o.frequency.exponentialRampToValueAtTime(n * 2, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.1, t + dur * 0.5);
  o.connect(g); g.connect(masterGain);
  o.start(t);
  chargeVoice = { o, g };
}
function stopChargeTone(){
  if (!chargeVoice || !actx) return;
  const t = actx.currentTime;
  chargeVoice.g.gain.cancelScheduledValues(t);
  chargeVoice.g.gain.setValueAtTime(chargeVoice.g.gain.value, t);
  chargeVoice.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  chargeVoice.o.stop(t + 0.08);
  chargeVoice = null;
}

function startPortal(cellK){
  state = 'portalIn';
  const dest = portals.get(cellK).pair;
  const fxA = portalFX.get(cellK), fxB = portalFX.get(dest);
  if (fxA){ fxA.flare = 1; fxA.charge = 0; }
  if (fxB) fxB.flare = 1;
  // each pair has its own note, so a portal sounds like itself
  const n = fxA && fxA.note ? fxA.note : 440;
  sfxSweep(n * 2, n * 0.5, 0.38, 0.16, 'triangle');    // falling in
  tw = { t:0, dur:380, c0:player.position.clone(), n:Nf.clone(), dest };
}
function emergeFromPortal(destKey){
  const fx = portalFX.get(destKey);
  if (fx) fx.flare = 1;
  const n = fx && fx.note ? fx.note : 440;
  sfxSweep(n * 0.5, n * 2, 0.42, 0.16, 'triangle');    // rising out
  const [fi, u, v] = destKey.split(',').map(Number);
  P.copy(cellToPoint(fi, u, v));
  Nf.copy(FACES[fi].n);
  player.quaternion.copy(playerTargetQuat());
  updateFaceHUD();
  const c1 = P.clone().addScaledVector(Nf, PSIZE/2 + 0.01 + faceLift(fi));
  // rotate the cube so the destination face faces the camera
  // rotate the cube so the destination face faces the camera
  const worldN = Nf.clone().applyQuaternion(world.quaternion);
  const aim = featureOn('freeCam') ? CAM_DIR.clone() : new THREE.Vector3(0, 1, 0);
  const qd = worldN.dot(aim) < -0.99
    ? new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), Math.PI)
    : new THREE.Quaternion().setFromUnitVectors(worldN, aim);
  state = 'portalOut';
  tw = { t:0, dur:560, fromQ: world.quaternion.clone(),
         toQ: qd.multiply(world.quaternion.clone()).normalize(), c1 };
}

function levelComplete(){
  phase = 'wait';
  // a small rising chord
  sfxBell(523.25, 1.1, 0.18);
  setTimeout(() => sfxBell(659.25, 1.1, 0.18), 90);
  setTimeout(() => sfxBell(783.99, 1.4, 0.2), 180);
  showOverlay('LEVEL ' + level + ' CLEAR');
  setTimeout(() => { level++; buildLevel(); hideOverlay(); phase = 'play'; }, 1500);
}
function failLevel(){
  phase = 'wait';
  sfxSweep(220, 110, 0.9, 0.16, 'triangle');
  sfxWood(80, 0.5, 0.3, 1.5);
  showOverlay('OUT OF TIME');
  setTimeout(() => { buildLevel(); hideOverlay(); phase = 'play'; }, 1500);
}

  { name:'OBJECTIVE',  keys:['keystone', 'oneways', 'timer', 'bonusTime', 'sprint'] },
  { name:'OBSTACLES',  keys:['towers', 'rails', 'holes', 'bridges', 'portals', 'monuments'] },

];

function buildFeatureRow(key, container){
  const f = FEATURES[key];
  let sl = null;                       // declared before the handler closes over it
  const row = document.createElement('div');
  row.className = 'featRow';
  row.innerHTML =
    '<div><div class="fname">' + f.name + '</div>' +
    '<div class="fdesc">' + f.desc + '</div></div>' +
    '<div class="tog"></div>';
  const tog = row.querySelector('.tog');
  const sync = () => tog.classList.toggle('on', f.on);
  sync();
  row.addEventListener('click', () => {
    f.on = !f.on;
    sync();
    if (sl) sl.style.display = f.on ? 'block' : 'none';
    if (phase === 'menu') return;
    // display-only switches must not regenerate the level under test
    if (key === 'solution') drawTrail();
    else if (key === 'facePalette'){ updateFaceTextures(); }
    else if (key === 'palette'){ applyPalette(); buildLevel(); }
    else if (key === 'tint'){ clearTintCache(); buildLevel(); }
    else if (key === 'monuments') buildLevel();
    else if (key === 'masonry') buildLevel();
    else if (key === 'blockGap'){ applyBevels(); buildLevel(); }
    else if (key === 'bevels'){ applyBevels(); rebuildBridgeGeo(); buildLevel(); }
    else if (key === 'shadows') applyShadows();
    else if (key === 'sound'){ if (f.on) audio(); else stopChargeTone(); }
    else if (key === 'drone'){ if (f.on){ audio(); startDrone(); } else stopDrone(); }
    else if (key === 'seeThrough'){ if (!f.on) clearSeeThrough(); }
    else if (key === 'freeCam' || key === 'skewView'){
      camMove = null;
      if (key === 'skewView') skewCur = skewTarget();
      applyCamera();
    }
    else buildLevel();
  });
  container.appendChild(row);

  // live sliders for features that declare them — tune while playing
  const slDefs = [];
  if (f.slider) slDefs.push(Object.assign({ key:'main', label:null }, f.slider));
  if (f.sliders) for (const s of f.sliders) slDefs.push(s);
  if (slDefs.length){
    sl = document.createElement('div');
    sl.style.display = f.on ? 'block' : 'none';
    for (const def of slDefs){
      const row = document.createElement('div');
      row.className = 'featSlider';
      const inp = document.createElement('input');
      inp.type = 'range';

        if (key === 'sound' && masterGain) masterGain.gain.value = v/100 * 0.5;
        if (key === 'drone' && droneGain) droneGain.gain.value = v/100 * 0.35;
        if (key === 'shadows') applyShadows();
        if (key === 'tint'){

          tintTimer = setTimeout(() => { clearTintCache(); buildLevel(); }, 140);
        }
        if (key === 'facePalette') updateFaceTextures();
        if (key === 'palette'){
          applyPalette();
          clearTimeout(palTimer);
          palTimer = setTimeout(() => buildLevel(), 140);
        }
        if (key === 'monuments'){
          clearTimeout(monTimer);
          monTimer = setTimeout(() => buildLevel(), 140);
        }
        if (key === 'masonry'){
          clearTimeout(masTimer);
          masTimer = setTimeout(() => buildLevel(), 140);
        }
        if (key === 'blockGap'){
          clearTimeout(gapTimer);
          gapTimer = setTimeout(() => { applyBevels(); buildLevel(); }, 140);
        }
        applyCamera();
      });
      if (def.label){
        const lbl = document.createElement('div');
        lbl.className = 'slLabel';
        lbl.textContent = def.label;
        lbl.title = def.hint || '';
        sl.appendChild(lbl);
      }
      row.append(inp, val);
      sl.appendChild(row);
    }
    container.appendChild(sl);
