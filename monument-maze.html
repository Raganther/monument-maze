// ---------- movement state machine ----------
let state = 'idle';
let peeked = false;               // cube rotated for a look-around, player may be hidden
let tw = null;

const _mid = new THREE.Vector3();
const _wDir = new THREE.Vector3(), _sDir = new THREE.Vector3();

// Direction selection: candidates are the 4 grid axes of the current face,
// scored in screen space. On the top-position plane they project to perfect
// diagonals and tie, so a ±45° bias breaks the tie — and its handedness
// (diagBias) flips at edge crossings so the held key keeps meaning 'forward'
// whichever side you arrived from (heading continuity).
let diagBias = 1;
function pickDir(sx, sy, bias, qOverride){
  const wq = qOverride || world.quaternion;
  // With SKEWED VIEW the four directions project to distinct screen angles, so
  // the tie is broken by geometry — no bias needed (and it would fight the view).
  if (featureOn('skewView') && !featureOn('freeCam')){
    let best = null, bestScore = 0.25;
    for (const a of AXES){
      if (Math.abs(a.dot(Nf)) > 0.5) continue;
      _wDir.copy(a).applyQuaternion(wq);
      _sDir.copy(_wDir).applyQuaternion(_invCamQ);
      const score = _sDir.x*sx + _sDir.y*sy;
      if (score > bestScore){ bestScore = score; best = a; }
    }
    return best;
  }
  // Under the free camera there's no fixed convention to snap to, so ties are
  // broken against the camera's own angle — deterministic at any orbit.
  const b = featureOn('freeCam')
    ? (Math.cos(camAz) * Math.sin(camAz) >= 0 ? 1 : -1)
    : bias;
  const bx = (sx + b*sy) * Math.SQRT1_2;
  const by = (sy - b*sx) * Math.SQRT1_2;
  let best = null, bestScore = 0.25;
  for (const a of AXES){
    if (Math.abs(a.dot(Nf)) > 0.5) continue;
    _wDir.copy(a).applyQuaternion(wq);
    _sDir.copy(_wDir).applyQuaternion(_invCamQ);
    const score = _sDir.x*sx + _sDir.y*sy + 0.2*(_sDir.x*bx + _sDir.y*by);
    if (score > bestScore){ bestScore = score; best = a; }
  }
  return best;
}

function tryStep(sx, sy, resolveQ){
  if (state !== 'idle' || phase !== 'play') return;
  autoPush = null;                    // a deliberate move overrides the tile's push
  const D = pickDir(sx, sy, diagBias, resolveQ);
  if (!D) return;
  executeStep(D, resolveQ, sx, sy);
}

// perform a step in cube-local direction D. Shared by player input and the
// one-way auto-push, so both obey the same edge/wall/one-way rules. sx/sy are
// the originating screen coords (for heading continuity after a crossing); the
// auto-push has none, so they fall back to the resolved direction itself.
function executeStep(D, resolveQ, sx, sy){
  if (state !== 'idle' || phase !== 'play') return;

  // one-way tile: refuse to leave against the arrow (matches neighborsOf, so
  // what the player can do equals what the solver planned). Instead of a dead
  // stop, the player lurches at the invisible barrier and springs back.
  const hereFi = faceIndexOf(Nf);
  const hereC = pointToCell(hereFi, P);
  const owDir = oneways.get(cellKey(hereFi, hereC.u, hereC.v));
  if (owDir && D.dot(owDir) < 0.9){
    state = 'bounce';
    sfxWood(140, 0.11, 0.55, 2);            // a dull thud against the barrier
    sfxBreath(320, 520, 0.18, 0.06);        // a little rebound whoosh
    tw = { t:0, dur:260, fromP:P.clone(), pushDir:D.clone() };
    return;
  }

  // moving off a portal before its dwell expires: you've declined it
  if (portalArmed){
    const fx = portalFX.get(portalArmed.key);
    if (fx) fx.charge = 0;
    portalArmed = null;
    stopChargeTone();
  }

  if (rails.has(railKey(_mid.copy(P).addScaledVector(D, CELL/2)))){
    sfxWood(150, 0.09, 0.5, 3);      // bump: a blocked move should be heard
    return;
  }

  const cand = P.clone().addScaledVector(D, CELL);
  const [ta, tb] = basisOf(Nf);
  const inside =
    Math.abs(cand.dot(ta)) <= H - CELL/2 + 1e-4 &&
    Math.abs(cand.dot(tb)) <= H - CELL/2 + 1e-4;

  if (inside){
    const fi = faceIndexOf(Nf);
    const c = pointToCell(fi, cand);
    // push block? try to shove it; if it moves, the player follows into its cell
    const destK = cellKey(fi, c.u, c.v);
    if (pushBlocks.has(destK)){
      const pc = pointToCell(fi, P);
      if (tryPush(destK, cellKey(fi, pc.u, pc.v), D)){
        sfxWood(90, 0.14, 0.6, 2);
        // follow the block into its old cell, in sync, so the player's face
        // stays in contact with the block rather than leaving a gap
        if (walkable(fi, c.u, c.v)){
          state = 'slide';
          tw = { t:0, dur:150, fromP:P.clone(), toP:cand };
        }
      } else sfxWood(150, 0.09, 0.5, 3);                        // block won't budge
      return;
    }
    if (!walkable(fi, c.u, c.v)){ sfxWood(150, 0.09, 0.5, 3); return; }  // bump
    state = 'slide';
    // slight random pitch so repeated steps don't machine-gun
    sfxWood(380 + Math.random()*90, 0.045, 0.28, 8);
    tw = { t:0, dur:SLIDE_MS * speed(), fromP:P.clone(), toP:cand };
  } else {
    const toP = P.clone().addScaledVector(D, CELL/2).addScaledVector(Nf, -CELL/2);
    const nfIdx = faceIndexOf(D);
    const lc = pointToCell(nfIdx, toP);
    // push block across the edge? shove it, player stays on this face
    const destK = cellKey(nfIdx, lc.u, lc.v);
    if (pushBlocks.has(destK)){
      const pfi = faceIndexOf(Nf);
      const pc = pointToCell(pfi, P);
      if (tryPush(destK, cellKey(pfi, pc.u, pc.v), D)) sfxWood(90, 0.14, 0.6, 2);
      else sfxWood(150, 0.09, 0.5, 3);
      return;
    }
    if (!walkable(nfIdx, lc.u, lc.v)) return;

    // decide against where the view is SETTLING to, not its mid-flight state
    const decideQ = resolveQ || (viewEase ? viewEase.toQ : world.quaternion);
    const worldN = D.clone().applyQuaternion(decideQ);
    const axis = new THREE.Vector3().crossVectors(Nf, D).normalize();
    const c0 = P.clone().addScaledVector(Nf, PSIZE/2 + 0.01 + faceLift(faceIndexOf(Nf)));
    const c1 = toP.clone().addScaledVector(D, PSIZE/2 + 0.01 + faceLift(nfIdx));
    const bulge = Nf.clone().add(D).normalize();
    const q0 = player.quaternion.clone();

    // destination visible from the current camera -> the player flips over the
    // edge (cube static). Genuinely on the far side -> the cube swivels to
    // bring that plane into view, player riding along. Uses a back-face test
    // (dot > 0) rather than a margin: at axis-aligned camera angles a face can
    // sit exactly edge-on, and a margin would swivel when it needn't.
    if (worldN.dot(CAM_DIR) > 0.001){
      state = 'flip';
      sfxBreath(900, 400, 0.3, 0.12);        // the player tumbling over an edge
      tw = { t:0, dur:FLIP_MS * speed(), fromP:P.clone(), toP, axis, c0, c1, bulge, q0 };
    } else {
      // rotate the cube about the shared edge so the new face takes the old
      // one's place. If a view settle is in flight, start from its target so
      // the two rotations compose instead of fighting.
      const baseQ = viewEase ? viewEase.toQ.clone() : world.quaternion.clone();
      viewEase = null;
      const qLocal = new THREE.Quaternion().setFromUnitVectors(D, Nf);
      state = 'swivel';
      sfxBreath(500, 180, 0.5, 0.2);         // the whole cube turning: deeper, longer
      tw = { t:0, dur:SWIVEL_MS * speed(), fromP:P.clone(), toP, axis, c0, c1, bulge, q0,
             fromQ: world.quaternion.clone(),
             toQ: baseQ.multiply(qLocal).normalize() };
    }
    // heading continuity: after the crossing, the key that carried you over
    // must keep meaning 'forward' (which is -oldNormal on the new face).
    // Flip the diagonal handedness if that's what forward requires.
    const cont = Nf.clone().negate();
    Nf.copy(D);
    // auto-push has no screen coords: project D to screen so scoring still works
    let ssx = sx, ssy = sy;
    if (ssx === undefined){
      _sDir.copy(D).applyQuaternion(resolveQ || world.quaternion).applyQuaternion(_invCamQ);
      ssx = _sDir.x; ssy = _sDir.y;
    }
    for (const b of [diagBias, -diagBias]){
      const p = pickDir(ssx, ssy, b);
      if (p && p.dot(cont) > 0.9){ diagBias = b; break; }
    }
    updateFaceHUD();
    // Favour the destination plane NOW, as the crossing begins — not after it
    // lands. The elevation target already switched with Nf above, so setting
    // the skew sign here lets azimuth and elevation ease together into one
    // smooth arc. Deferring it to the landing swings elevation during the flip
    // and azimuth afterward — two perpendicular moves that read as an L-shaped
    // detour back through the neutral view. For a swivel the cube ends at
    // tw.toQ, so judge the sign against that final orientation.
    const landQ = state === 'swivel' ? tw.toQ : world.quaternion;
    updateSkewSign(landQ);
    // Start a dedicated camera arc to the LANDING cell's view, on its own clock
    // (CAM_TURN_MS) rather than the flip's. Two reasons: the target is locked to
    // where the player lands, so the view doesn't chase P across the edge (where
    // the elevation help reads ~0) and snap back to default mid-flip; and a
    // longer, gently eased arc lets the camera settle after the tumble instead
    // of matching its speed — a calmer follow, still whip-free (slow start).
    camMove = { t:0, dur: CAM_TURN_MS * speed(),
                s0: skewCur, e0: elevCur,
                s1: skewTarget(), e1: elevTarget(tw.toP, landQ) };
  }
}

// ---------- free look: spin the cube to any angle ----------
// A purely visual rotation — the player's face and position never change.
// Hold Q/E to turn the cube continuously about the vertical screen axis.
// Movement then snaps to the nearest clean orientation first, so direction
// scoring is never ambiguous (it ties at 45°).
const SCREEN_UP = new THREE.Vector3(0, 1, 0);
const SPIN_SPEED = 1.7;                 // radians per second
const _spinQ = new THREE.Quaternion();
function spin(dir, dt){
  if (phase !== 'play') return;
  // allowed mid-step: rotating while the player moves is the point
  if (state === 'swivel' || state === 'portalIn' || state === 'portalOut') return;
  if (featureOn('freeCam')){
    // orbit the camera; the cube stays put. The swivel handles hidden planes.
    camAz += dir * SPIN_SPEED * dt / 1000;
    applyCamera();
    return;
  }
  viewEase = null;                    // manual input takes the wheel
  _spinQ.setFromAxisAngle(SCREEN_UP, dir * SPIN_SPEED * dt / 1000);
  world.quaternion.premultiply(_spinQ).normalize();
  peeked = true;
}
// is the player's face turned toward the camera?
function playerVisible(q){
  return Nf.clone().applyQuaternion(q || world.quaternion).dot(CAM_DIR) > 0.001;
}

// the skew we want right now (signed), in radians
function skewTarget(){
  if (!featureOn('skewView') || featureOn('freeCam')) return 0;
  return skewSign * FEATURES.skewView.slider.value * Math.PI/180;
}

// Elevation help for the two blind zones of a fixed camera. Both scale with
// how deep into the zone the player is, so it eases in.
// posOverride / qOverride let callers evaluate the target at a point OTHER than
// the live player position — e.g. the landing cell of a crossing, so the view
// eases straight to where the player will be rather than chasing the edge value
// as P interpolates across it (which momentarily reads depth 0 = ISO_EL and
// yanks the camera back to the default before it settles).
function elevTarget(posOverride, qOverride){
  if (!featureOn('skewView') || featureOn('freeCam')) return ISO_EL;
  const S = FEATURES.skewView.sliders;
  const lift = S[0].value * Math.PI/180, dip = S[1].value * Math.PI/180;
  // keep the view usable: too flat and the planes go edge-on, too steep and
  // the sides vanish
  const clamp = e => Math.min(1.30, Math.max(0.22, e));   // ~12.5° .. ~74.5°
  // where is the player, in world space, on the cube?
  const q = qOverride || world.quaternion;
  const wp = (posOverride || P).clone().applyQuaternion(q);
  const wn = Nf.clone().applyQuaternion(q);
  if (Math.abs(wn.y) < 0.5){
    // side plane: the further down, the lower the view drops
    const depth = Math.min(1, Math.max(0, (H*0.35 - wp.y) / (H * 1.35)));
    return clamp(ISO_EL - lift * depth);
  }
  if (wn.y > 0.5){
    // top plane: the further toward the far edge, the higher the view rises
    const away = CAM_DIR.clone().setY(0).normalize().negate();
    const d = wp.clone().setY(0).dot(away) / H;          // -1 near .. +1 far
    const depth = Math.min(1, Math.max(0, (d - 0.05) / 0.95));
    return clamp(ISO_EL + dip * depth);
  }
  return ISO_EL;
}
// ease the camera skew and elevation toward their targets
function updateSkew(dt){
  // A crossing arc in flight: drive the camera along its own eased curve from
  // the start angles to the locked landing targets. Slow start (easeFlip) means
  // no whip; its own clock (CAM_TURN_MS) lets it glide gently past the flip.
  if (camMove){
    camMove.t += dt;
    const k = easeFlip(Math.min(1, camMove.t / camMove.dur));
    skewCur = camMove.s0 + (camMove.s1 - camMove.s0) * k;
    elevCur = camMove.e0 + (camMove.e1 - camMove.e0) * k;
    applyCamera();
    if (camMove.t >= camMove.dur) camMove = null;   // hand back to live follow
    return;
  }
  // Idle / within-plane motion: chase the live position-based target with a
  // gentle exponential smoother.
  const ts = skewTarget(), te = elevTarget();
  const ds = Math.abs(skewCur - ts), de = Math.abs(elevCur - te);
  if (ds < 0.0005 && de < 0.0005){
    if (skewCur !== ts || elevCur !== te){
      skewCur = ts; elevCur = te; applyCamera();
    }
    return;
  }
  const k = 1 - Math.exp(-CAM_FOLLOW * dt / 1000);
  skewCur += (ts - skewCur) * k;
  elevCur += (te - elevCur) * k;
  applyCamera();
}
// on arriving at a new plane, mirror the skew if this plane is the squashed one.
// A side plane is 'favoured' when the camera has swung toward it.
function updateSkewSign(q){
  if (!featureOn('skewView') || featureOn('freeCam')) return;
  const wn = Nf.clone().applyQuaternion(q || world.quaternion);
  if (Math.abs(wn.y) > 0.5) return;          // top/bottom: no side preference
  // camera azimuth swings toward +z as skew grows: favour whichever side plane
  // the player is on
  const wantSign = wn.z > 0.5 ? 1 : (wn.x > 0.5 ? -1 : skewSign);
  skewSign = wantSign;
}
// settle the free-spun view: snap to the nearest grid-square orientation, then
// quarter-turn as needed until the player's face is back in view
// Settle the free-spun view. This runs ALONGSIDE the player's step, not before
// it: it starts an independent camera-only ease and reports the settled
// orientation so the step resolves against where the view is going, not where
// it currently is. One key press = snap and step, together.
let viewEase = null;      // { t, dur, fromQ, toQ } — camera only, never blocks
function settleView(){
  peeked = false;
  let target;
  if (featureOn('freeCam')){
    // free camera: rotate the CUBE so the player's plane faces the camera
    if (playerVisible()) return null;
    target = world.quaternion.clone();
    const axis = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < 4 && !playerVisible(target); i++){
      target = new THREE.Quaternion()
        .setFromAxisAngle(axis, Math.PI/2).multiply(target).normalize();
    }
    if (!playerVisible(target)) return null;
  } else {
    target = snapToGrid(world.quaternion);
    for (let i = 0; i < 4 && !playerVisible(target); i++){
      target = new THREE.Quaternion()
        .setFromAxisAngle(SCREEN_UP, Math.PI/2)
        .multiply(target).normalize();
    }
  }
  if (world.quaternion.angleTo(target) < 0.02) return null;
  viewEase = { t:0, dur:340, fromQ: world.quaternion.clone(), toQ: target.clone() };
  return target;
}
// nearest orientation whose axes are camera-aligned (grid square on screen)
function snapToGrid(q){
  const m = new THREE.Matrix4().makeRotationFromQuaternion(q);
  const cols = [
    new THREE.Vector3().setFromMatrixColumn(m, 0),
    new THREE.Vector3().setFromMatrixColumn(m, 1),
    new THREE.Vector3().setFromMatrixColumn(m, 2),
  ];
  const snap = v => {
    const a = [Math.abs(v.x), Math.abs(v.y), Math.abs(v.z)];
    const i = a.indexOf(Math.max(...a));
    const o = new THREE.Vector3();
    o.setComponent(i, Math.sign(v.getComponent(i)) || 1);
    return o;
  };
  const x = snap(cols[0]);
  let y = snap(cols[1]);
  if (Math.abs(x.dot(y)) > 0.5) y = snap(cols[2]);       // degenerate: use z
  const z = new THREE.Vector3().crossVectors(x, y);
  return new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(x, y, z)).normalize();
}
// ---------- input ----------
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup',   e => keys[e.code] = false);
function pollKeys(){
  const moving = keys['ArrowUp'] || keys['KeyW'] || keys['ArrowDown'] || keys['KeyS'] ||
                 keys['ArrowLeft'] || keys['KeyA'] || keys['ArrowRight'] || keys['KeyD'];
  // settle the view and step on the SAME press — the camera eases back while
  // the player moves, rather than the snap eating the first keystroke.
  // While Q/E is held you're steering: don't fight it, just move.
  const steering = keys['KeyQ'] || keys['KeyE'];
  let resolveQ = null;
  if (moving && peeked && !steering) resolveQ = settleView();
  if (keys['ArrowUp']    || keys['KeyW']) return tryStep(0, 1, resolveQ);
  if (keys['ArrowDown']  || keys['KeyS']) return tryStep(0,-1, resolveQ);
  if (keys['ArrowLeft']  || keys['KeyA']) return tryStep(-1,0, resolveQ);
  if (keys['ArrowRight'] || keys['KeyD']) return tryStep(1, 0, resolveQ);
}
// swipe to move — but not when the drag starts on the UI (lab panel, menu),
// where a drag means scrolling
let swipe = null;
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('#lab, #menu, #hud, #touchControls')) return;
  swipe = { x:e.clientX, y:e.clientY };
});
addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.hypot(dx,dy) < 18) return;
  if (Math.abs(dx) > Math.abs(dy)) tryStep(Math.sign(dx), 0);
  else tryStep(0, -Math.sign(dy));
});

// ---------- on-screen touch controls ----------
// The D-pad drives the SAME key flags the poll reads, so all the settle/steer
// logic applies exactly as with a real keyboard. Movement buttons fire a single
// step per tap; turn buttons hold the spin while pressed.
const DIR_KEY = { up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight' };
function bindHoldButton(el, onDown, onUp){
  if (!el) return;
  const down = e => { e.preventDefault(); onDown(); };
  const up   = e => { e.preventDefault(); onUp && onUp(); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
// direction buttons mirror the keyboard exactly: press sets the key flag, release
// clears it. pollKeys (each idle frame) turns that into one step per tap and a
// natural repeat when held — honouring movement state, portals, one-ways, etc.
for (const el of document.querySelectorAll('#dpad .dbtn[data-dir]')){
  const k = DIR_KEY[el.dataset.dir];
  bindHoldButton(el,
    () => { audio(); keys[k] = true; },
    () => { keys[k] = false; });
}
// turn buttons: hold to spin the cube (same as holding Q / E)
bindHoldButton(document.getElementById('tQ'),
  () => { audio(); keys['KeyQ'] = true; }, () => { keys['KeyQ'] = false; });
bindHoldButton(document.getElementById('tE'),
  () => { audio(); keys['KeyE'] = true; }, () => { keys['KeyE'] = false; });

// detect touch capability and tag the body so controls show even on hybrids
if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
addEventListener('touchstart', () => document.body.classList.add('touch'), { once:true, passive:true });

// ---------- easing ----------
const easeSlide = t => 1 - (1-t)*(1-t);
const easeFlip  = t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const _flipV = new THREE.Vector3(), _flipQ = new THREE.Quaternion();

// ---------- main loop ----------
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - last); last = now;

  if (phase === 'menu'){
    if (featureOn('freeCam')){ camAz += 0.00035 * dt; applyCamera(); }
    else world.rotateY(0.00035 * dt);   // gentle attract-mode spin
  }

  if (phase === 'play' && timerActive()){
    timeLeft -= dt / 1000;
    if (timeLeft <= 0){ timeLeft = 0; updateTimeHUD(); failLevel(); }
    else {
      updateTimeHUD();
      // a soft tick in the last ten seconds, quickening as it runs out
      if (timeLeft <= 10){
        const step = timeLeft <= 3 ? 0.25 : timeLeft <= 6 ? 0.5 : 1;
        if (Math.floor(timeLeft/step) !== Math.floor((timeLeft + dt/1000)/step))
          sfxWood(1200, 0.04, 0.16, 12);
      }
    }
  }

  // camera rotation runs regardless of movement state — hold Q/E while walking
  if (phase === 'play'){
    if (keys['KeyQ'])      spin(1, dt);
    else if (keys['KeyE']) spin(-1, dt);
  }
  if (phase === 'play' && state === 'idle'){
    pollKeys();
  } else if (tw){
    tw.t += dt;
    const raw = Math.min(1, tw.t / tw.dur);
    if (state === 'fall'){
      const k = raw * raw; // accelerate downward
      player.position.copy(tw.c0).addScaledVector(tw.n, -k * HOLE_DEPTH);
      player.scale.setScalar(Math.max(0.35, 1 - 0.5 * k));
      if (raw >= 1) respawn();
    } else if (state === 'bounce'){
      // out-and-back: a quick lurch toward the barrier, then a spring return.
      // sin gives a smooth there-and-back; the cube visibly refuses the move.
      const push = Math.sin(raw * Math.PI) * CELL * 0.32;
      const local = tw.fromP.clone().addScaledVector(tw.pushDir, push);
      P.copy(local);
      player.position.copy(P).addScaledVector(Nf, PSIZE/2 + 0.01 + faceLift(faceIndexOf(Nf)));
      // a tiny recoil tilt into the barrier for physicality
      const tilt = Math.sin(raw * Math.PI) * 0.18;
      const axis = new THREE.Vector3().crossVectors(Nf, tw.pushDir).normalize();
      _flipQ.setFromAxisAngle(axis, tilt);
      player.quaternion.copy(_flipQ);
      if (raw >= 1){
        P.copy(tw.fromP);
        player.position.copy(P).addScaledVector(Nf, PSIZE/2 + 0.01 + faceLift(faceIndexOf(Nf)));
        player.quaternion.identity();
        tw = null; state = 'idle';
      }
    } else if (state === 'portalIn'){
      const k = raw * raw;
      player.position.copy(tw.c0).addScaledVector(tw.n, -k * HOLE_DEPTH);
      player.scale.setScalar(Math.max(0.4, 1 - 0.5 * k));
      if (raw >= 1) emergeFromPortal(tw.dest);
    } else if (state === 'portalOut'){
      const k = 1 - (1 - raw) * (1 - raw);
      world.quaternion.copy(tw.fromQ).slerp(tw.toQ, k);
      player.position.copy(tw.c1).addScaledVector(Nf, -HOLE_DEPTH * (1 - k));
      player.scale.setScalar(0.5 + 0.5 * k);
      if (raw >= 1){
        world.quaternion.copy(tw.toQ);
        player.scale.setScalar(1);
        tw = null; state = 'idle';
        drawTrail();
      }
    } else {
      if (state === 'slide'){
        P.copy(tw.fromP).lerp(tw.toP, easeSlide(raw));
      } else {
        const k = easeFlip(raw);
        P.copy(tw.fromP).lerp(tw.toP, k);
        if (state === 'swivel') world.quaternion.copy(tw.fromQ).slerp(tw.toQ, k);
        _flipV.copy(tw.c0).lerp(tw.c1, k)
          .addScaledVector(tw.bulge, Math.sin(Math.PI * k) * CELL * 0.45);
        player.position.copy(_flipV);
        _flipQ.setFromAxisAngle(tw.axis, k * Math.PI / 2);
        player.quaternion.copy(_flipQ).multiply(tw.q0);
      }
      if (raw >= 1){
        P.copy(tw.toP);
        if (tw.toQ){ world.quaternion.copy(tw.toQ).normalize(); }
        tw = null; state = 'idle';
        updateSkewSign();      // cube has settled: favour the plane we're on
        const fi = faceIndexOf(Nf);
        const c = pointToCell(fi, P);
        const hereK = cellKey(fi, c.u, c.v);
        if (holes.has(hereK)) startFall();
        else if (portals.has(hereK)){
          portalArmed = { key: hereK, t: 0 };
          startChargeTone(hereK);
        }
        else {
          checkGem();
          if (isGoalObjective() && finishKey === hereK) levelComplete();
          else drawTrail();
          // one-way tile: it carries you onward — a short beat, then a push in
          // the arrow's direction, so stepping on commits you across it
          const owDir = oneways.get(hereK);
          if (owDir && state === 'idle'){
            autoPush = { dir: owDir.clone(), t: performance.now() + 130 };
          }        }
      }
    }
  }

  if (state !== 'flip' && state !== 'swivel' && state !== 'fall'
      && state !== 'portalIn' && state !== 'portalOut'){
    placePlayer(P);
    player.quaternion.slerp(playerTargetQuat(), 1 - Math.exp(-0.012*dt*60));
  }

  // portal light: steady, with a flare on activation and a visible charge-up
  // one-way auto-push: after landing on an arrow tile and a short beat, the
  // tile carries the player onward in its direction (with a soft push sound)
  if (autoPush && state === 'idle' && phase === 'play'){
    if (now >= autoPush.t){
      const dir = autoPush.dir;
      autoPush = null;
      sfxWood(300, 0.05, 0.3, 6);            // a gentle shove onward
      sfxBreath(600, 750, 0.14, 0.05);
      executeStep(dir, world.quaternion);
    }
  } else if (autoPush && state !== 'idle' && state !== 'bounce'){
    // player did something else mid-beat that isn't a bounce — cancel the push
    // (bounce means they tried the wrong way and are still on the tile)
  }

  // while the player dwells on it
  const t = now * 0.001;
  for (const fx of portalFX.values()){
    fx.flare = Math.max(0, fx.flare - dt/450);
    const f = 1 + fx.flare * 2.5 + (fx.charge || 0) * 1.6;
    fx.lightMat.opacity = Math.min(0.85, 0.32 * f);
    fx.light.intensity  = 0.45 * (1 + fx.flare * 3.5 + (fx.charge || 0) * 2);
  }

  // gem idle animation
  for (const g of gems){
    if (g.taken) continue;
    g.mesh.rotateOnAxis(_upY, 0.015);
    g.mesh.position.copy(g.pos).addScaledVector(
      FACES[g.face].n,
      CELL*0.35 + faceLift(g.face) + Math.sin(t*2 + g.phase)*CELL*0.06
    );
  }

  // solution trail: a pulse flows along the dots toward the goal
  for (const d of dots){
    const w = Math.sin(t*3 - d.i*0.45);
    d.mesh.material.opacity = 0.28 + 0.34 * Math.max(0, w);
    d.mesh.scale.setScalar(d.base * (0.85 + 0.3 * Math.max(0, w)));
  }

  // independent camera settle — runs alongside movement, never blocks it.
  // Yields to crossings, which own the cube's rotation while they animate.
  if (viewEase){
    if (state === 'swivel' || state === 'portalOut'){
      viewEase = null;                    // the crossing takes over
    } else {
      viewEase.t += dt;
      const k = Math.min(1, viewEase.t / viewEase.dur);
      world.quaternion.copy(viewEase.fromQ).slerp(viewEase.toQ, easeFlip(k));
      if (k >= 1){ world.quaternion.copy(viewEase.toQ).normalize(); viewEase = null; }
    }
  }

  // portal dwell: linger on a portal and it takes you; step away and it doesn't
  if (portalArmed && phase === 'play' && state === 'idle'){
    portalArmed.t += dt;
    const fx = portalFX.get(portalArmed.key);
    if (fx) fx.charge = Math.min(1, portalArmed.t / PORTAL_DWELL);
    if (portalArmed.t >= PORTAL_DWELL){
      const k = portalArmed.key;
      portalArmed = null;
      stopChargeTone();
      startPortal(k);
    }
  }

  if (phase === 'play') updateSkew(dt);
  if (phase === 'play') tickKeystone(dt);
  if (phase === 'play') tickPushBlocks(dt);
  updateSeeThrough(dt);

  renderer.render(scene, camera);
}

applyPalette();        // set the default stone palette before first build
buildLevel();          // decorative backdrop behind the menu
requestAnimationFrame(frame);

addEventListener('resize', () => {
  setupCamera();
  renderer.setSize(innerWidth, innerHeight);
});

})();
</script>
</body>
</html>
