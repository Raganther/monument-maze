<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MONUMENT MAZE</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; touch-action:none;
    -webkit-user-select:none; user-select:none;
    background: linear-gradient(175deg, #f7e8d8 0%, #ecd5cd 45%, #d5c3d9 100%);
    font-family: Georgia, 'Times New Roman', serif; }
  canvas { display:block; }

  #hud {
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; align-items:center; pointer-events:none;
    flex-wrap:wrap; justify-content:center;
  }
  .chip {
    background:rgba(255,252,246,0.75); border:1px solid rgba(90,70,90,0.18);
    border-radius:20px; padding:6px 14px; color:#5c4a5e; font-size:13px;
    letter-spacing:2px; display:flex; align-items:center; gap:8px;
    box-shadow:0 2px 10px rgba(90,70,90,0.08);
  }
  #faceDot { width:9px; height:9px; border-radius:50%; background:#eec170; }
  #timeChip.low { color:#b23a3a; border-color:rgba(178,58,58,0.4); }
  #menuBtn, #labBtn { pointer-events:auto; cursor:pointer; }
  #menuBtn:hover, #labBtn:hover { background:rgba(255,252,246,0.95); }
  #buildTag {
    position:fixed; bottom:10px; right:12px; z-index:50; pointer-events:none;
    background:rgba(255,252,246,0.75); border:1px solid rgba(90,70,90,0.18);
    border-radius:20px; padding:5px 12px; color:#5c4a5e; font-size:12px;
    letter-spacing:2px; box-shadow:0 2px 10px rgba(90,70,90,0.08);
    font-family:Georgia,'Times New Roman',serif;
  }

  #lab {
    position:fixed; top:70px; right:16px; display:none; flex-direction:column;
    background:rgba(255,252,246,0.94); border:1px solid rgba(90,70,90,0.22);
    border-radius:12px; padding:14px 16px; width:252px;
    max-height:calc(100vh - 100px);
    box-shadow:0 6px 24px rgba(90,70,90,0.16);
  }
  #featList {
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    min-height:0; flex:1; margin-right:-6px; padding-right:6px;
  }
  #featList::-webkit-scrollbar { width:5px; }
  #featList::-webkit-scrollbar-thumb {
    background:rgba(90,70,90,0.25); border-radius:3px;
  }
  #featList::-webkit-scrollbar-track { background:transparent; }
  .labTitle { color:#5c4a5e; letter-spacing:4px; font-size:13px; margin-bottom:6px; }
  .labCat {
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 4px 6px 4px; margin-top:4px; cursor:pointer; user-select:none;
    border-bottom:1px solid rgba(90,70,90,0.12);
  }
  .labCat:hover .catName { color:#5c4a5e; }
  .catName { color:rgba(92,74,94,0.85); font-size:11px; letter-spacing:3px; font-weight:600; }
  .catChev { color:rgba(92,74,94,0.5); font-size:11px; }
  .catBody { overflow:hidden; }
  .catBody.collapsed { display:none; }
  .labLevel {
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:10px; border-bottom:1px solid rgba(90,70,90,0.15);
  }
  .labLevel > span { color:#5c4a5e; font-size:12px; letter-spacing:3px; }
  .lvlBtns { display:flex; align-items:center; gap:10px; }
  .lvlBtn {
    width:24px; height:24px; border-radius:6px; background:rgba(90,70,90,0.12);
    color:#5c4a5e; font-size:16px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; user-select:none;
  }
  .lvlBtn:hover { background:rgba(90,70,90,0.22); }
  #lvlNum { color:#5c4a5e; font-size:14px; min-width:20px; text-align:center; }
  .featRow {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:9px 0; border-top:1px solid rgba(90,70,90,0.1); cursor:pointer;
  }
  .fname { color:#5c4a5e; font-size:13px; letter-spacing:2px; }
  .fdesc { color:rgba(92,74,94,0.55); font-size:11px; font-style:italic; }
  .tog {
    width:34px; height:18px; border-radius:9px; background:rgba(90,70,90,0.18);
    position:relative; flex:none; transition:background .15s;
  }
  .tog::after {
    content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
    border-radius:50%; background:#fff; transition:left .15s;
    box-shadow:0 1px 3px rgba(90,70,90,0.3);
  }
  .tog.on { background:#84b6a6; }
  .tog.on::after { left:18px; }
  .slLabel {
    color:rgba(92,74,94,0.55); font-size:10px; letter-spacing:2px;
    margin-top:4px;
  }
  .featSlider {
    display:flex; align-items:center; gap:10px; padding:2px 0 10px 0;
  }
  .featSlider input[type=range] { flex:1; accent-color:#84b6a6; }
  .featSlider span { color:rgba(92,74,94,0.7); font-size:11px; min-width:30px; text-align:right; white-space:nowrap; }
  .labNote { color:rgba(92,74,94,0.45); font-size:10px; font-style:italic; margin-top:8px; }
  .labClose { margin-top:8px; text-align:center; color:#5c4a5e; font-size:11px; letter-spacing:3px; cursor:pointer; }

  #hint {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    color:rgba(92,74,94,0.5); font-size:11px; letter-spacing:2px;
    pointer-events:none; white-space:nowrap; font-style:italic;
  }

  #overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; transition:opacity 0.35s;
  }
  #overlay span {
    color:#5c4a5e; font-size:34px; letter-spacing:8px;
    background:rgba(255,252,246,0.85); padding:18px 38px; border-radius:8px;
    border:1px solid rgba(90,70,90,0.2); box-shadow:0 6px 30px rgba(90,70,90,0.15);
  }

  #menu {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px;
    background:rgba(247,232,216,0.55); backdrop-filter:blur(3px);
  }
  #menu h1 {
    margin:0; color:#5c4a5e; font-size:42px; letter-spacing:12px; font-weight:normal;
    text-shadow:0 2px 12px rgba(255,252,246,0.8);
  }
  #menu .sub {
    margin:0 0 26px; color:rgba(92,74,94,0.6); font-size:13px;
    letter-spacing:4px; font-style:italic;
  }
  .modeBtn {
    width:min(320px, 80vw); background:rgba(255,252,246,0.85);
    border:1px solid rgba(90,70,90,0.22); border-radius:10px;
    padding:14px 22px; margin:6px 0; cursor:pointer; text-align:left;
    box-shadow:0 3px 14px rgba(90,70,90,0.1); transition:transform .12s, box-shadow .12s;
  }
  .modeBtn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(90,70,90,0.16); }
  .modeBtn .mname { color:#5c4a5e; font-size:16px; letter-spacing:4px; }
  .modeBtn .mdesc { color:rgba(92,74,94,0.6); font-size:12px; font-style:italic; margin-top:4px; }

  /* ---------- on-screen touch controls ---------- */
  #touchControls {
    position:fixed; bottom:22px; left:0; right:0; display:none;
    justify-content:space-between; align-items:flex-end;
    padding:0 24px; pointer-events:none; z-index:20;
  }
  #dpad {
    display:grid; grid-template-columns:repeat(3, 54px); grid-template-rows:repeat(3, 54px);
    gap:6px; pointer-events:none;
  }
  #dUp    { grid-column:2; grid-row:1; }
  #dLeft  { grid-column:1; grid-row:2; }
  .dcenter{ grid-column:2; grid-row:2; background:none; border:none; box-shadow:none; }
  #dRight { grid-column:3; grid-row:2; }
  #dDown  { grid-column:2; grid-row:3; }
  .dbtn, .tbtn {
    pointer-events:auto; -webkit-user-select:none; user-select:none; touch-action:none;
    background:rgba(255,252,246,0.82); border:1px solid rgba(90,70,90,0.22);
    border-radius:14px; color:#5c4a5e; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 10px rgba(90,70,90,0.12); transition:transform .06s, background .06s;
  }
  .dbtn:active, .tbtn:active { transform:scale(0.9); background:rgba(224,160,58,0.35); }
  #turnPad { display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .tbtn { width:54px; height:54px; font-size:26px; }

  /* show the pad on touch / coarse-pointer devices */
  @media (pointer:coarse) {
    #touchControls { display:flex; }
    #hint { display:none; }        /* the keyboard hint is irrelevant on touch */
  }
  body.touch #touchControls { display:flex; }
  body.touch #hint { display:none; }

  /* ---------- narrow-screen (phone) layout ---------- */
  @media (max-width:560px) {
    #hud {
      top:10px; gap:6px; padding:0 8px; width:100%; box-sizing:border-box;
    }
    .chip { padding:5px 10px; font-size:11px; letter-spacing:1px; }
    /* keep only the essential chips; fold the rest behind smaller sizing */
    #lab {
      top:auto; bottom:0; right:0; left:0; width:auto;
      max-height:70vh; border-radius:16px 16px 0 0;
      padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    }
    #menu h1 { font-size:32px; letter-spacing:8px; }
    #overlay span { font-size:24px; letter-spacing:5px; padding:14px 26px; }
    /* lift the pad above the phone's home indicator */
    #touchControls { bottom:calc(18px + env(safe-area-inset-bottom)); padding:0 16px; }
  }
  @media (max-width:380px) {
    #dpad { grid-template-columns:repeat(3, 48px); grid-template-rows:repeat(3, 48px); }
    .tbtn { width:48px; height:48px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div class="chip" id="levelChip">LEVEL 1</div>
  <div class="chip"><div id="faceDot"></div><span id="faceName">TOP</span></div>
  <div class="chip" id="gems">&#9670; 0 / 5</div>
  <div class="chip" id="timeChip">1:20</div>
  <div class="chip" id="labBtn">LAB</div>
  <div class="chip" id="menuBtn">MENU</div>
</div>
<div id="hint">arrows / WASD or swipe &nbsp;&middot;&nbsp; hold Q / E to turn the cube &nbsp;&middot;&nbsp; collect every &#9670;</div>
<div id="touchControls">
  <div id="dpad">
    <div class="dbtn" id="dUp" data-dir="up">&#9650;</div>
    <div class="dbtn" id="dLeft" data-dir="left">&#9664;</div>
    <div class="dbtn dcenter"></div>
    <div class="dbtn" id="dRight" data-dir="right">&#9654;</div>
    <div class="dbtn" id="dDown" data-dir="down">&#9660;</div>
  </div>
  <div id="turnPad">
    <div class="tbtn" id="tQ" data-turn="q">&#8634;</div>
    <div class="tbtn" id="tE" data-turn="e">&#8635;</div>
  </div>
</div>
<div id="overlay"><span id="overlayText"></span></div>
<div id="buildTag"></div>
<div id="lab">
  <div class="labTitle">LABORATORY</div>
  <div class="labLevel">
    <span>LEVEL</span>
    <div class="lvlBtns">
      <div class="lvlBtn" id="lvlDown">&minus;</div>
      <span id="lvlNum">1</span>
      <div class="lvlBtn" id="lvlUp">+</div>
    </div>
  </div>
  <div id="featList"></div>
  <div class="labNote">toggling rebuilds the level</div>
  <div class="labClose" id="labClose">CLOSE</div>
</div>
<div id="menu">
  <h1>MONUMENT MAZE</h1>
  <p class="sub">a puzzle on six planes</p>
  <div id="modeList"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// ---------- build stamp ----------
// Bump this on every change so you can confirm at a glance you're running the
// latest build (shown bottom-right in-game and under the menu title). Format:
// YYYY.MM.DD.n  — n resets to 1 each day, increments for same-day builds.
const BUILD = '2026.08.22.7';
(function stampBuild(){
  const tag = document.getElementById('buildTag');
  if (tag) tag.textContent = 'BUILD ' + BUILD;
  const sub = document.querySelector('#menu .sub');
  if (sub) sub.textContent += '  ·  build ' + BUILD;
})();

// ---------- mode registry ----------
// A mode is data, not a copy of the code. New experiments = new entries here
// (plus, if needed, a feature system gated behind a flag). Every mode shares
// the one engine: movement, generation, rendering.
// OBJECTIVES sit on top of ONE shared open layout. The layout generator is the
// same for all three (the breathable Classic board — sparse blocks, monuments,
// negative space); the objective only decides what's placed on top and what
// "winning" means. This keeps every lab dynamic available to every objective.
const MODES = {
  collect: {
    name: 'COLLECT',
    desc: 'Gather every gem across the six planes.',
    timer: true,
    density: 1.0,
    objective: 'collect',
  },
  reach: {
    name: 'REACH',
    desc: 'Find the single goal and get there.',
    timer: false,
    density: 1.0,
    objective: 'reach',
  },
  puzzle: {
    name: 'PUZZLE',
    desc: 'Solve the maze — no clock, no rush.',
    timer: false,
    density: 1.0,
    objective: 'puzzle',
  },
};
let modeKey = 'collect';
const MODE = () => MODES[modeKey];
// goal-based objectives (reach a single finish) vs gem collection
const isGoalObjective = () => MODE().objective === 'reach' || MODE().objective === 'puzzle';

// ---------- feature lab ----------
// Gameplay elements as switches: flip one on to test it, off to shelve it —
// no code surgery either way. Three hook shapes cover everything:
//   gen()   runs during level build (adds content/data)
//   onGem() runs on collect (events)
//   plain values the engine reads (see speed())
const FEATURES = {
  towers: {
    name:'TOWERS', desc:'the stacked cube obstacles',
    on:true,
    gen(){ generateObstacles(Math.min(Math.round((20 + level*8) * MODE().density), 80)); },
  },
  rails: {
    name:'RAILS', desc:'thin walls along the grid seams',
    on:true,
    gen(){ generateRails(Math.min(8 + level*3, 26)); },
  },
  holes: {
    name:'HOLES', desc:'open pits — fall in, start over',
    on:false,
    gen(){ generateHoles(Math.min(3 + level*2, 14)); },
  },
  bridges: {
    name:'TUNNELS', desc:'stone tunnels to pass through — sides are walled',
    on:true,
    gen(){ generateBridges(Math.min(2 + level, 8)); },
  },
  portals: {
    name:'PORTALS', desc:'linked doorways — matching colours connect',
    on:true,
    gen(){ generatePortals(Math.min(2 + (level >> 1), 4)); },
  },
  timer: {
    name:'TIME LIMIT', desc:'the clock itself — off for pure exploration',
    on:false,
  },
  bonusTime: {
    name:'TIME BONUS', desc:'+3s for every gem collected',
    on:false,
    onGem(){ if (timerActive()) timeLeft += 3; },
  },
  sprint: {
    name:'SPRINT', desc:'snappier movement animations',
    on:false,
  },
  sound: {
    name:'SOUND', desc:'wood, bells and breath — all synthesised',
    on:true,
    slider: { min:0, max:100, step:5, value:60, unit:'%' },
  },
  drone: {
    name:'DRONE', desc:'a slow pad in C — the key the gems ring in',
    on:false,
    slider: { min:0, max:100, step:5, value:45, unit:'%' },
  },
  masonry: {
    name:'MASONRY', desc:'blocks built from smaller stones — hand-laid, not cast',
    on:true,
    slider: { min:0, max:100, step:1, value:50, unit:'%' },
    sliders: [
      { key:'rough', label:'ROUGHNESS', min:0, max:100, step:5, value:20, unit:'%',
        hint:'uneven heights and missing stones — quarried, not tidy' },
      { key:'heightVar', label:'HEIGHT VARIATION', min:0, max:100, step:5, value:75, unit:'%',
        hint:'tumbledown skyline — some blocks low, some stacked tall (visual only)' },
    ],
  },
  blockGap: {
    name:'BLOCK GAP', desc:'spacing between neighbouring blocks — flush or inset',
    on:true,
    slider: { min:0, max:16, step:1, value:0, unit:'%' },
  },
  oneways: {
    name:'ONE-WAY TILES', desc:'arrows you can only cross one way — commitment and routing',
    on:true,
    gen(){ generateOneWays(Math.min(2 + (level >> 1), 8)); },
  },
  keystone: {
    name:'KEYSTONE', desc:'collect the gems, then journey to the awakened monument to finish',
    on:false,
  },
  monuments: {
    name:'MONUMENTS', desc:'occasional little landmarks — ziggurats, obelisks, arches',
    on:true,
    slider: { min:0, max:100, step:5, value:60, unit:'%' },
  },
  facePalette: {
    name:'FACE PALETTE', desc:'the six cube-face colours — from pastel to ancient stone',
    on:true,
    slider: { min:0, max:9, step:1, value:9, unit:'' },
    sliders: [
      { key:'texture', label:'WEATHERING', min:0, max:100, step:5, value:100, unit:'%',
        hint:'strength of the aged-stone mottling, streaks and cracks' },
      { key:'moss', label:'VEGETATION', min:0, max:100, step:5, value:75, unit:'%',
        hint:'moss and lichen creeping over the stone' },
    ],
  },
  palette: {
    name:'STONE PALETTE', desc:'the base stone colours — tuned to sit against the pastel faces',
    on:true,
    slider: { min:0, max:6, step:1, value:1, unit:'' },
    sliders: [
      { key:'weather', label:'WEATHERING', min:0, max:100, step:5, value:30, unit:'%',
        hint:'mottling and stains aged into the stone surface' },
      { key:'moss', label:'VEGETATION', min:0, max:100, step:5, value:25, unit:'%',
        hint:'moss creeping up the lower stones' },
    ],
  },
  tint: {
    name:'STONE VARIATION', desc:'each block a slightly different shade — weathered, never cloned',
    on:true,
    slider: { min:0, max:100, step:1, value:15, unit:'%' },
  },
  bevels: {
    name:'BEVELS', desc:'softened edges that catch the light — crafted, not default',
    on:false,
    slider: { min:0, max:14, step:1, value:6, unit:'%' },
  },
  shadows: {
    name:'SHADOWS', desc:'blocks cast onto the faces — grounds them in the space',
    on:true,
    slider: { min:0, max:100, step:5, value:75, unit:'%' },
  },
  seeThrough: {
    name:'SEE THROUGH', desc:'obstacles hiding the player fade out',
    on:false,
    slider: { min:5, max:70, step:5, value:22, unit:'%' },
  },
  solution: {
    name:'SOLUTION', desc:'breadcrumb trail along the route — a testing tool',
    on:false,
  },
  freeCam: {
    name:'FREE CAMERA', desc:'orbit freely; the cube stays put and you move relative to the view',
    on:false,
  },
  skewView: {
    name:'SKEWED VIEW', desc:'offset the locked angle so forward is obvious on the top plane',
    on:true,
    slider: { min:0, max:40, step:1, value:20, unit:'\u00b0' },
    sliders: [
      { key:'lift', label:'SIDE DROP', min:0, max:30, step:1, value:0, unit:'\u00b0',
        hint:'lower the view on the side planes' },
      { key:'dip', label:'TOP RISE', min:0, max:30, step:1, value:0, unit:'\u00b0',
        hint:'raise the view at the top plane\u2019s far edge' },
    ],
  },
};
const featureOn = k => FEATURES[k].on;
const speed = () => featureOn('sprint') ? 0.55 : 1;
const timerActive = () => MODE().timer && featureOn('timer');

// ---------- layout ----------
const N = 6;
const H = 3;
const CELL = (2*H) / N;
// Camera feel (SKEWED VIEW). Larger CAM_TURN_MS = slower plane-to-plane swing;
// smaller CAM_FOLLOW = slower drift as you walk deeper into a plane.
const CAM_TURN_MS = 950;   // duration of the camera's skew/elevation arc on a crossing
const CAM_FOLLOW  = 3.2;   // exponential rate for within-plane follow (was 6)

const SLIDE_MS = 150;
const FLIP_MS  = 340;
// A swivel rotates the whole cube to bring a hidden plane into view, so its
// rotation IS the dominant transition motion — keep it in step with the camera
// arc (CAM_TURN_MS) so a top/bottom/back crossing settles at the same pace as a
// left/right flip, whose motion the camera arc dominates instead.
const SWIVEL_MS = CAM_TURN_MS;

const FACES = [
  { n:new THREE.Vector3( 1,0,0), name:'EAST',   color:'#e08e79' },
  { n:new THREE.Vector3(-1,0,0), name:'WEST',   color:'#84b6a6' },
  { n:new THREE.Vector3(0, 1,0), name:'TOP',    color:'#eec170' },
  { n:new THREE.Vector3(0,-1,0), name:'BOTTOM', color:'#9a8fb8' },
  { n:new THREE.Vector3(0,0, 1), name:'SOUTH',  color:'#d98ba0' },
  { n:new THREE.Vector3(0,0,-1), name:'NORTH',  color:'#7f9bc4' },
];
const AXES = [
  new THREE.Vector3(1,0,0), new THREE.Vector3(-1,0,0),
  new THREE.Vector3(0,1,0), new THREE.Vector3(0,-1,0),
  new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,-1),
];

// ---------- renderer / scene / fixed iso camera ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

let camera;
const ISO_EL = Math.atan(1/Math.SQRT2);      // the classic isometric elevation
const _invCamQ = new THREE.Quaternion();     // world -> screen
const CAM_DIR = new THREE.Vector3(1,1,1).normalize();   // camera view direction
// free-camera orbit: azimuth around the cube, elevation above it
let camAz = Math.PI/4, camEl = Math.atan(1/Math.SQRT2);   // matches the locked iso view
// SKEWED VIEW mirrors left/right so neither side plane is permanently the
// squashed one. It flips only when the player changes plane — never mid-walk,
// which would swing the view and change what the keys mean underfoot.
let skewSign = 1, skewCur = 0, elevCur = Math.atan(1/Math.SQRT2);
// an in-flight camera arc for a plane crossing: { t, dur, s0,e0 -> s1,e1 }.
// Runs on its own clock so it can outlast the flip for a gentler settle.
let camMove = null;
const CAM_R = Math.sqrt(12*12*3);   // the classic (12,12,12) isometric distance
function applyCamera(){
  if (featureOn('freeCam')){
    camera.position.set(
      CAM_R * Math.cos(camEl) * Math.cos(camAz),
      CAM_R * Math.sin(camEl),
      CAM_R * Math.cos(camEl) * Math.sin(camAz));
    camera.up.set(0, 1, 0);
  } else {    // locked view. SKEWED VIEW offsets the azimuth off the symmetric isometric:
    // at 0° the top plane's four directions project to identical diagonals, so
    // nothing on screen says which way is forward. Offsetting breaks that tie
    // geometrically — one direction reads clearly up-screen. The offset mirrors
    // (skewSign) so neither side plane stays squashed forever.
    const az = Math.PI/4 + skewCur;
    const el = elevCur;
    camera.position.set(
      CAM_R * Math.cos(el) * Math.cos(az),
      CAM_R * Math.sin(el),
      CAM_R * Math.cos(el) * Math.sin(az));
    camera.up.set(0, 1, 0);
  }
  camera.lookAt(0, 0, 0);
  // a NaN anywhere in the camera blanks the whole render — never let one through
  if (!Number.isFinite(camera.position.x + camera.position.y + camera.position.z)){
    console.warn('camera NaN guarded; falling back to isometric');
    skewCur = 0; elevCur = ISO_EL;
    camera.position.set(12, 12, 12);
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);
  }
  _invCamQ.copy(camera.quaternion).invert();
  CAM_DIR.copy(camera.position).normalize();
}
function setupCamera(){
  const aspect = innerWidth / innerHeight;
  const S = H * 2.1;
  camera = new THREE.OrthographicCamera(-S*aspect, S*aspect, S, -S, 0.1, 100);
  applyCamera();
}

// Shadow strength trades the sun against the sky fill: a stronger sun casts

  sun.castShadow = on && s > 0;

// Per-face canvases: redrawn each level so hole openings can be cut straight
// out of the surface (alphaTest discards the erased pixels, revealing the
// shaft geometry sunk inside the cube).
const faceCanvases = [], faceTextures = [];
function drawFaceBase(fi){
  const c = faceCanvases[fi];
  const g = c.getContext('2d');
  g.clearRect(0,0,512,512);
  g.fillStyle = faceColor(fi); g.fillRect(0,0,512,512);
  if (activeFacePalette().ruin){
    const wx = FEATURES.facePalette.sliders[0].value / 100;   // WEATHERING
    const mo = FEATURES.facePalette.sliders[1].value / 100;   // VEGETATION
    if (wx > 0) drawStoneTexture(g, fi, wx);
    if (mo > 0) drawVegetation(g, fi, mo);
  }
  const s = 512 / N;
  g.strokeStyle = 'rgba(60,45,70,0.16)'; g.lineWidth = 2;
  for (let i=1;i<N;i++){
    g.beginPath(); g.moveTo(i*s,0); g.lineTo(i*s,512); g.stroke();
    g.beginPath(); g.moveTo(0,i*s); g.lineTo(512,i*s); g.stroke();
  }
  g.strokeStyle = 'rgba(60,45,70,0.35)'; g.lineWidth = 8;
  g.strokeRect(0,0,512,512);
}

// procedural aged-stone surface, scaled by amount (0..1)
function drawStoneTexture(g, fi, amt){
  const rnd = seededRand((fi*2654435761 + 12345) >>> 0);
  g.save();
  for (let i = 0; i < 90; i++){
    const x = rnd()*512, y = rnd()*512, r = 20 + rnd()*90;
    const dark = rnd() < 0.5;
    const a = (0.03 + rnd()*0.06) * amt;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, (dark ? 'rgba(50,42,38,' : 'rgba(255,252,245,') + a + ')');
    grad.addColorStop(1, (dark ? 'rgba(50,42,38,0)' : 'rgba(255,252,245,0)'));
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }
  for (let i = 0; i < 900; i++){
    g.fillStyle = rnd() < 0.5 ? 'rgba(40,34,30,' + (0.05*amt) + ')'
                              : 'rgba(255,250,240,' + (0.05*amt) + ')';
    g.fillRect(rnd()*512, rnd()*512, 2, 2);
  }
  g.strokeStyle = 'rgba(50,44,38,' + (0.05*amt) + ')';
  for (let i = 0; i < 6; i++){
    const x = rnd()*512;
    g.lineWidth = 6 + rnd()*22;
    g.beginPath(); g.moveTo(x, 0);
    g.bezierCurveTo(x + (rnd()-0.5)*40, 180, x + (rnd()-0.5)*50, 340, x + (rnd()-0.5)*30, 512);
    g.stroke();
  }
  g.strokeStyle = 'rgba(40,34,30,' + (0.14*amt) + ')'; g.lineWidth = 1.5;
  for (let i = 0; i < 5; i++){
    let x = rnd()*512, y = rnd()*512;
    g.beginPath(); g.moveTo(x, y);
    const steps = 3 + (rnd()*4|0);
    for (let s = 0; s < steps; s++){
      x += (rnd()-0.5)*140; y += (rnd()-0.5)*140;
      g.lineTo(x, y);
    }
    g.stroke();
  }
  g.restore();
}

// moss and lichen creeping over the stone — pools along the lower edge and in
// corners where damp collects, thinning toward the top. amount 0..1 grows it.
function drawVegetation(g, fi, amt){
  const rnd = seededRand((fi*40503 + 907) >>> 0);
  g.save();
  const greens = ['#6f8f4e', '#7fa05a', '#5c7d42', '#8aa668', '#647f48'];
  // patches: probability weighted toward the bottom of the face (higher y)
  const n = Math.round(60 + amt * 200);
  for (let i = 0; i < n; i++){
    // bias y downward: moss grows up from the base
    const yb = Math.pow(rnd(), 0.5);          // skew toward 1 (bottom)
    if (rnd() > amt * (0.35 + 0.65*yb)) continue;   // sparser higher up
    const x = rnd()*512, y = yb*512;
    const r = 6 + rnd()*34;
    const col = greens[(rnd()*greens.length)|0];
    const a = 0.10 + rnd()*0.28;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, hexA(col, a));
    grad.addColorStop(0.7, hexA(col, a*0.5));
    grad.addColorStop(1, hexA(col, 0));
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }
  // speckle of brighter lichen dots on top of the moss
  const dots = Math.round(amt * 400);
  for (let i = 0; i < dots; i++){
    const yb = Math.pow(rnd(), 0.6);
    g.fillStyle = hexA(greens[(rnd()*greens.length)|0], 0.25);
    g.fillRect(rnd()*512, yb*512, 2 + rnd()*3, 2 + rnd()*3);
  }
  g.restore();
}
function hexA(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
const cubeMats = FACES.map((f, fi) => {

  faceCanvases.push(c);

  faceTextures.push(t);
  return new THREE.MeshLambertMaterial({ map:t, alphaTest:0.5 });
});

// Maps a cube-local point to face-texture pixels. Derived from BoxGeometry's
// buildPlane UV conventions per face (order: +x,-x,+y,-y,+z,-z):
// [uComponent, uDir, vComponent, vDir] with s = .5 + cu/(2H*uDir), t = .5 - cv/(2H*vDir)
const UV_TABLE = [
  [2,-1, 1,-1],  // +x
  [2, 1, 1,-1],  // -x
  [0, 1, 2, 1],  // +y
  [0, 1, 2,-1],  // -y
  [0, 1, 1,-1],  // +z
  [0,-1, 1,-1],  // -z
];
function updateFaceTextures(){
  for (let fi = 0; fi < 6; fi++) drawFaceBase(fi);
  const sz = (512/N) * (HOLE_OPEN/CELL);
  for (const [fi,u,v] of holeList.concat(portalList)){
    const p = cellToPoint(fi, u, v);
    const [uc, ud, vc, vd] = UV_TABLE[fi];
    const s = 0.5 + p.getComponent(uc) / (2*H*ud);
    const t = 0.5 - p.getComponent(vc) / (2*H*vd);
    faceCanvases[fi].getContext('2d')
      .clearRect(s*512 - sz/2, (1-t)*512 - sz/2, sz, sz);
  }
  for (const tx of faceTextures) tx.needsUpdate = true;
}

// ---------- face / cell helpers ----------
function faceIndexOf(normal){
  for (let i=0;i<FACES.length;i++) if (FACES[i].n.dot(normal) > 0.9) return i;
  return 2;
}
function basisOf(normal){
  const perp = AXES.filter(a => Math.abs(a.dot(normal)) < 0.5 && (a.x+a.y+a.z) > 0);
  return [perp[0], perp[1]];
}
function cellToPoint(faceIdx, u, v){
  const f = FACES[faceIdx];
  const [ta, tb] = basisOf(f.n);
  const p = f.n.clone().multiplyScalar(H);
  p.addScaledVector(ta, (u - (N-1)/2) * CELL);
  p.addScaledVector(tb, (v - (N-1)/2) * CELL);
  return p;
}
function pointToCell(faceIdx, p){
  const [ta, tb] = basisOf(FACES[faceIdx].n);
  return {
    u: Math.round(p.dot(ta)/CELL + (N-1)/2),
    v: Math.round(p.dot(tb)/CELL + (N-1)/2)
  };
}
const cellKey = (fi,u,v) => fi + ',' + u + ',' + v;

// ---------- bevelled blocks ----------
// three r128 has no rounded box, so build one: subdivide a box and project
// every vertex onto a rounded-box surface (clamp to the inner box, push out
// by the radius). Gives a true bevel on all twelve edges and eight corners.
function makeRoundedBox(w, h, d, r, seg){
  const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
  const pos = g.attributes.position;
  const cx = w/2 - r, cy = h/2 - r, cz = d/2 - r;
  const v = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++){
    v.fromBufferAttribute(pos, i);
    c.set(
      Math.max(-cx, Math.min(cx, v.x)),
      Math.max(-cy, Math.min(cy, v.y)),
      Math.max(-cz, Math.min(cz, v.z)));
    v.sub(c);
    const len = v.length();
    if (len > 1e-6) v.multiplyScalar(r / len);
    pos.setXYZ(i, c.x + v.x, c.y + v.y, c.z + v.z);
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}
const bevelAmt = () => featureOn('bevel') ? FEATURES.bevel.slider.value / 100 : 0;

// A box with all twelve edges softened. Three r128 has no bevelled box, so:
// extrude a rounded-corner square (rounds the 4 vertical edges) with bevelling
// enabled (rounds the 8 top/bottom edges). The result catches light along
// every corner — the trick that makes low-poly geometry look crafted.
function makeBevelBox(w, h, d, r){
  r = Math.min(r, Math.min(w, d) * 0.32, h * 0.45);
  const x = w/2 - r, z = d/2 - r;
  const shape = new THREE.Shape();
  shape.moveTo(-x, -d/2);
  shape.lineTo(x, -d/2);
  shape.quadraticCurveTo(w/2, -d/2, w/2, -z);
  shape.lineTo(w/2, z);
  shape.quadraticCurveTo(w/2, d/2, x, d/2);
  shape.lineTo(-x, d/2);
  shape.quadraticCurveTo(-w/2, d/2, -w/2, z);
  shape.lineTo(-w/2, -z);
  shape.quadraticCurveTo(-w/2, -d/2, -x, -d/2);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: h - r*2, bevelEnabled: true,
    bevelThickness: r, bevelSize: r, bevelSegments: 2, curveSegments: 3,
  });
  g.rotateX(-Math.PI/2);                      // extrude axis z -> y
  g.translate(0, -(h/2 - r) + r, 0);          // recentre on the origin
  g.computeVertexNormals();
  return g;
}

// block geometry is rebuilt when the bevel amount changes
function bevelAmount(){
  return featureOn('bevel') ? CELL * FEATURES.bevel.slider.value / 100 : 0;
}
function buildBlockGeo(){
  const r = bevelAmount();
  if (r < 0.001) return new THREE.BoxGeometry(BLOCK, CELL, BLOCK);
  return makeBevelBox(BLOCK, CELL, BLOCK, r);
}

let BLOCK = CELL;           // block footprint, driven by the BLOCK GAP slider
function blockSize(){

}
const stoneA = new THREE.MeshLambertMaterial({ color:0xded0c2 });
const stoneB = new THREE.MeshLambertMaterial({ color:0xcdbcae });

// Curated stone palettes, each a cohesive pair of course tones plus a cap
// accent, tuned to sit against the saturated pastel faces without competing.
// Kept light and low-saturation so the coloured faces stay the loud element.
const STONE_PALETTES = [
  { name:'Warm Stone',  a:0xded0c2, b:0xcdbcae, cap:0xe08e79 },  // original earthy beige
  { name:'Bone',        a:0xf2ece1, b:0xe4dccd, cap:0xd98c74 },  // pale porcelain
  { name:'Sandstone',   a:0xe6d3ac, b:0xd4bd93, cap:0xcf8b5a },  // golden desert
  { name:'Cool Grey',   a:0xd8dade, b:0xc3c6cc, cap:0x9aa6b2 },  // neutral slate
  { name:'Blush Stone', a:0xecdcda, b:0xdcc7c6, cap:0xc98d8f },  // faint warm pink
  { name:'Lavender Ash',a:0xd9d6e0, b:0xc6c2d2, cap:0x9d93b8 },  // cool violet-grey
  { name:'Chalk',       a:0xf0f0ee, b:0xe1e2e2, cap:0xb9b4ac },  // near-white minimal
];
// smooth value noise over 3D position — used to pool moss and band weathering
// across the whole cube surface, flowing over block boundaries. Deterministic.
function vnoise(x, y, z){
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const fade = t => t*t*t*(t*(t*6-15)+10);
  const h = (a,b,c) => {
    let n = (a*374761393 + b*668265263 + c*2147483647) >>> 0;
    n = (n ^ (n >>> 13)) * 1274126177 >>> 0;
    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
  };
  const u = fade(xf), v = fade(yf), w = fade(zf);
  const lerp = (a,b,t) => a + (b-a)*t;
  return lerp(
    lerp(lerp(h(xi,yi,zi),   h(xi+1,yi,zi),   u), lerp(h(xi,yi+1,zi),   h(xi+1,yi+1,zi),   u), v),
    lerp(lerp(h(xi,yi,zi+1), h(xi+1,yi,zi+1), u), lerp(h(xi,yi+1,zi+1), h(xi+1,yi+1,zi+1), u), v),
    w);
}
// fractal noise: a couple of octaves for more organic pooling
function fnoise(x, y, z){
  return vnoise(x, y, z) * 0.65 + vnoise(x*2.3+11, y*2.3+7, z*2.3+3) * 0.35;
}

function applyPalette(){
  const idx = featureOn('palette')
    ? Math.max(0, Math.min(STONE_PALETTES.length - 1, FEATURES.palette.slider.value)) : 0;
  const p = STONE_PALETTES[idx];
  // clear any old texture maps (superseded by world-space tinting)
  for (const mat of [stoneA, stoneB]){ if (mat.map){ mat.map.dispose(); mat.map = null; mat.needsUpdate = true; } }
  stoneA.color.setHex(p.a);
  stoneB.color.setHex(p.b);
  capMat.color.setHex(p.cap);
  clearTintCache();                   // tinted clones derive from these — refresh
}

// A box with chamfered edges. Built by extruding a rounded rectangle profile
// with a bevel on the extrusion — so every edge catches a sliver of light,
// which is what separates 'crafted' low-poly from 'default cube'.
function bevelledBox(w, h, d, r){
  if (r < 0.0015) return new THREE.BoxGeometry(w, h, d);
  r = Math.min(r, w/2 - 0.002, h/2 - 0.002, d/2 - 0.002);
  // ExtrudeGeometry's bevelSize expands the profile OUTWARD by r on every side,
  // and bevelThickness adds r to each end of the extrusion — so the profile is
  // inset by r and the depth shortened by 2r to land on the requested size.
  const iw = w/2 - r, id = d/2 - r;          // inset half-extents
  const cr = Math.min(r, iw*0.5, id*0.5);    // corner rounding within the inset
  const sw = iw - cr, sd = id - cr;
  const shape = new THREE.Shape();
  shape.moveTo(-sw, -id);
  shape.lineTo(sw, -id);
  shape.quadraticCurveTo(iw, -id, iw, -sd);
  shape.lineTo(iw, sd);
  shape.quadraticCurveTo(iw, id, sw, id);
  shape.lineTo(-sw, id);
  shape.quadraticCurveTo(-iw, id, -iw, sd);
  shape.lineTo(-iw, -sd);
  shape.quadraticCurveTo(-iw, -id, -sw, -id);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: h - r*2, bevelEnabled: true,
    bevelSize: r, bevelThickness: r, bevelSegments: 2, curveSegments: 2,
  });
  g.rotateX(-Math.PI/2);                     // extrude along +y
  g.translate(0, -(h/2 - r), 0);             // recentre on the origin
  g.computeVertexNormals();
  return g;
}
function bevelAmount(){
  return featureOn('bevels') ? FEATURES.bevels.slider.value / 100 * CELL * 0.09 : 0;
}

let blockGeo = null, blockEdges = null;
const edgeMat = new THREE.LineBasicMaterial({ color:0x5c4a5e, transparent:true, opacity:0.3 });

// rebuild the block geometry when the bevel size changes
function applyBevels(){
  BLOCK = blockSize();       // pick up the current gap setting
  const r = bevelAmount();
  if (blockGeo) blockGeo.dispose();
  if (blockEdges) blockEdges.dispose();
  blockGeo = bevelledBox(BLOCK, CELL, BLOCK, r);
  blockEdges = new THREE.EdgesGeometry(blockGeo, 30);
  // the bevel does the edge-definition job with light, so the ink can back off
  edgeMat.opacity = r > 0.0015 ? 0.12 : 0.3;
}
applyBevels();                 // build the initial geometry

// Stone variation: a stable per-cell lightness shift so no two blocks match,
// yet a given block is always the same shade (a hash of its cell, not random —
// otherwise it would shimmer on every rebuild). Cloned materials are cached and
// reused so we don't make hundreds of them per level.
function cellHash(fi, u, v, i){
  let h = (fi*131 + u*17 + v*7 + i*4099) >>> 0;
  h = (h ^ (h >>> 13)) * 0x5bd1e995 >>> 0;
  h = (h ^ (h >>> 15)) >>> 0;
  return h / 4294967295;                 // 0..1
}
const tintCache = new Map();
function clearTintCache(){
  for (const mat of tintCache.values()){ if (mat.map) mat.map.dispose(); }
  tintCache.clear();
}
let tintTimer = null, monTimer = null, gapTimer = null, masTimer = null, palTimer = null;
const _mossCol = new THREE.Color(0x6f8f4e);
// per-block weathered texture: painted by sampling the shared noise field at
// the block's WORLD position, so the fine mottled detail (real moss/staining,
// not a flat tint) flows continuously across blocks and never repeats.
function makeWeatherTex(baseHex, wx, wy, wz, weather, moss){
  const S = 64;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const base = new THREE.Color(baseHex);
  const img = g.createImageData(S, S);
  const dat = img.data;
  const mCol = _mossCol;
  for (let py = 0; py < S; py++){
    for (let px = 0; px < S; px++){
      // world coord of this texel: block origin + fraction across the block
      const fx = px / S, fy = py / S;
      const sx = wx + fx * 1.0, sy = wy + fy * 1.0, sz = wz;
      // sample noise at several scales: low for regional pooling, high for the
      // fine mottle within a block that makes it read as moss, not a flat fill
      const wN = fnoise(sx*1.6+40, sy*1.6+40, sz*1.6+40) * 0.6
               + fnoise(sx*9.0+40, sy*9.0+40, sz*9.0+40) * 0.4;
      const mN = fnoise(sx*1.3, sy*1.3, sz*1.3) * 0.45
               + fnoise(sx*5.0, sy*5.0, sz*5.0) * 0.30
               + fnoise(sx*13.0, sy*13.0, sz*13.0) * 0.25;
      let rr = base.r, gg = base.g, bb = base.b;
      // weathering: darken where the field is high, lighten where low — mottle
      if (weather > 0){
        const d = (wN - 0.5) * weather * 0.5;
        rr -= d; gg -= d; bb -= d;
      }
      // moss: blend toward green where the moss field is high. The threshold
      // pulls back hard at low slider values so moss stays in pools/patches
      // rather than blanketing — only the greenest areas grow at low settings.
      if (moss > 0){
        const thresh = 0.72 - moss * 0.42;      // 0.72 (sparse) -> 0.30 (lush)
        const cover = Math.max(0, mN - thresh) / (1 - thresh) * (0.6 + moss*0.4);
        const k = Math.min(0.82, cover);
        rr = rr + (mCol.r - rr) * k;
        gg = gg + (mCol.g - gg) * k;
        bb = bb + (mCol.b - bb) * k;
      }
      const o = (py*S + px) * 4;
      dat[o]   = Math.max(0, Math.min(255, rr*255));
      dat[o+1] = Math.max(0, Math.min(255, gg*255));
      dat[o+2] = Math.max(0, Math.min(255, bb*255));
      dat[o+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter;
  return t;
}

function stoneMat(base, fi, u, v, i){
  const tintOn = featureOn('tint');
  const weather = featureOn('palette') ? FEATURES.palette.sliders[0].value / 100 : 0;
  const moss    = featureOn('palette') ? FEATURES.palette.sliders[1].value / 100 : 0;

  // plain per-block lightness variation only (no weathering/moss): cheap tinted clone
  if (weather <= 0 && moss <= 0){
    if (!tintOn) return base;
    const amt = FEATURES.tint.slider.value / 100;
    if (amt <= 0) return base;
    const shift = (cellHash(fi, u, v, i) - 0.5) * 2 * 0.14 * amt;
    const step = Math.round(shift * 40);
    const key = (base === stoneA ? 'A' : 'B') + step;
    let mat = tintCache.get(key);
    if (!mat){
      mat = base.clone();
      const hsl = {}; base.color.getHSL(hsl);
      mat.color.setHSL(hsl.h, hsl.s, Math.max(0, Math.min(1, hsl.l + step/40)));
      tintCache.set(key, mat);
    }
    return mat;
  }

  // weathering/moss on: per-block texture sampled at world position. Quantise
  // the position to a grid so nearby blocks can share a cached texture — keeps
  // the material count sane while still flowing across the surface.
  const wx = fi*4 + u, wy = v + i, wz = (u + v*7 + fi*13) * 0.13;
  const gx = Math.round(wx), gy = Math.round(wy), gz = Math.round(wz*3);
  const key = (base === stoneA ? 'A' : 'B') + 'w' + Math.round(weather*10)
            + 'm' + Math.round(moss*10) + ':' + gx + ',' + gy + ',' + gz;
  let mat = tintCache.get(key);
  if (!mat){
    mat = base.clone();
    mat.color.setHex(0xffffff);            // texture carries the colour
    mat.map = makeWeatherTex('#'+base.color.getHexString(), gx, gy, gz*0.33, weather, moss);
    mat.needsUpdate = true;
    tintCache.set(key, mat);
  }
  return mat;
}

// ---------- monuments: occasional landmarks, one cell each ----------
// Each occupies a single cell's footprint exactly as a block does, so it
// registers as an ordinary blocked cell — the movement graph and solvability
// system never know the difference. Pure silhouette on top of a normal block.
function addMonument(kind, faceIdx, u, v){
  blocked.add(cellKey(faceIdx, u, v));
  const f = FACES[faceIdx];
  const base = cellToPoint(faceIdx, u, v);
  const q = new THREE.Quaternion().setFromUnitVectors(_upY, f.n);
  const g = new THREE.Group();
  g.position.copy(base);
  g.quaternion.copy(q);
  levelGroup.add(g);
  const mk = (w, h, d, up, mat) => {
    const m = new THREE.Mesh(bevelledBox(w, h, d, bevelAmount()), mat || stoneA);
    m.position.set(0, up + h/2, 0);   // local: +y is out of the face
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
    return m;
  };
  const tint = (i) => stoneMat(i % 2 ? stoneB : stoneA, faceIdx, u, v, i);

  if (kind === 'ziggurat'){
    // three stacked tiers, each smaller — a stepped monument
    mk(BLOCK,        CELL*0.5, BLOCK,        0,        tint(0));
    mk(BLOCK*0.68,   CELL*0.42, BLOCK*0.68,  CELL*0.5, tint(1));
    mk(BLOCK*0.38,   CELL*0.36, BLOCK*0.38,  CELL*0.92, tint(2));
  } else if (kind === 'obelisk'){
    // a broad-based tapering monument — wide foot, narrowing to a capped point
    const foot = mk(BLOCK*0.72, CELL*0.4, BLOCK*0.72, 0, tint(0));   // solid plinth
    const shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(BLOCK*0.2, BLOCK*0.46, CELL*1.5, 4),
      tint(1));
    shaft.position.set(0, CELL*0.4 + CELL*0.75, 0);
    shaft.rotation.y = Math.PI/4;
    shaft.castShadow = true; shaft.receiveShadow = true;
    g.add(shaft);
    // a small pyramid cap
    const cap = new THREE.Mesh(new THREE.ConeGeometry(BLOCK*0.21, CELL*0.4, 4), capMat);
    cap.position.set(0, CELL*0.4 + CELL*1.5 + CELL*0.2, 0);
    cap.rotation.y = Math.PI/4;
    cap.castShadow = true;
    g.add(cap);
  } else if (kind === 'stepPyramid'){
    // a squat stepped pyramid — four shrinking tiers, low and broad
    mk(BLOCK,      CELL*0.32, BLOCK,      0,        tint(0));
    mk(BLOCK*0.76, CELL*0.30, BLOCK*0.76, CELL*0.32, tint(1));
    mk(BLOCK*0.52, CELL*0.28, BLOCK*0.52, CELL*0.62, tint(2));
    mk(BLOCK*0.28, CELL*0.26, BLOCK*0.28, CELL*0.90, tint(3));
  } else if (kind === 'pillars'){
    // a pair of standing stones flanking a low slab — a shrine
    const l = mk(BLOCK*0.26, CELL*1.25, BLOCK*0.34, 0, tint(0)); l.position.x = -BLOCK*0.3;
    const r2 = mk(BLOCK*0.26, CELL*1.25, BLOCK*0.34, 0, tint(1)); r2.position.x = BLOCK*0.3;
    mk(BLOCK*0.5, CELL*0.3, BLOCK*0.5, 0, tint(2));                // low altar between
  } else if (kind === 'monolith'){
    // a single leaning slab — a standing stone, tilted just off vertical
    const slab = mk(BLOCK*0.5, CELL*1.6, BLOCK*0.28, 0, tint(0));
    slab.rotation.z = 0.11;
    slab.position.x = -CELL*0.08;
  } else if (kind === 'cairn'){
    // a rough pile — stacked stones of shrinking size, slightly offset
    const seed = seededRand((faceIdx*31 + u*7 + v*13 + 61) >>> 0);
    let yy = 0;
    const tiers = 4;
    for (let i = 0; i < tiers; i++){
      const sz = BLOCK * (0.8 - i*0.16);
      const hh = CELL * (0.34 - i*0.04);
      const st = mk(sz, hh, sz, yy, tint(i));
      st.position.x = (seed() - 0.5) * BLOCK * 0.18;   // rough offset
      st.position.z = (seed() - 0.5) * BLOCK * 0.18;
      st.rotation.y = (seed() - 0.5) * 0.5;
      yy += hh;
    }
  } else if (kind === 'arch'){
    // two legs and a lintel — a gateway you can't pass but can see through
    const legW = BLOCK*0.3;
    const l1 = mk(legW, CELL*1.3, BLOCK, 0, tint(0)); l1.position.x = -BLOCK*0.32;
    const l2 = mk(legW, CELL*1.3, BLOCK, 0, tint(1)); l2.position.x =  BLOCK*0.32;
    mk(BLOCK, CELL*0.34, BLOCK, CELL*1.3, tint(2));   // lintel across the top
  }
}
const MONUMENTS = ['ziggurat', 'obelisk', 'arch', 'stepPyramid', 'pillars', 'monolith', 'cairn'];
const monumentCells = [];

// ---------- masonry: blocks built from smaller stones ----------
// A cell block can be laid up from several smaller stones instead of cast as
// one — different sizes, slightly loose, like hand-set masonry. Purely visual:
// the cell is still one blocked cell, this just fills its volume differently.
// Deterministic per cell (hash-seeded) so a given block is always laid the same.
function seededRand(seed){
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967295; };
}
// build the little stones that fill one cell-block, into group g (local space,
// +y out of the face), spanning y in [0, CELL]. w,d are the block footprint.
function layStones(g, w, d, faceIdx, u, v, tier, topTier, vh){
  const rnd = seededRand((faceIdx*131 + u*17 + v*7 + tier*2749) >>> 0);
  const r = bevelAmount() * 0.6;
  const rough = featureOn('masonry') ? (FEATURES.masonry.sliders[0].value / 100) : 0;
  const inset = 0.008;                        // hairline mortar line
  const visH = CELL * (vh || 1);              // total rendered height (visual only)
  let placed = 0;
  const put = (cx, cy, cz, sw, sh, sd, matIdx) => {
    const m = new THREE.Mesh(bevelledBox(sw, sh, sd, Math.min(r, sh*0.3, sw*0.3)),
                             stoneMat(matIdx % 2 ? stoneB : stoneA, faceIdx, u, v, tier*8 + matIdx));
    m.position.set(cx, cy, cz);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
    placed++;
  };

  // Courses stacked bottom to top. The masonry rule: nothing rests on air, so
  // a course can only ever be as wide as — or narrower than — the one below it.
  // The base is always solid and full-width; breaking-up happens toward the top.
  // more courses when the block stands taller, so extra height reads as extra
  // stacked stones rather than one stretched course
  const extraCourses = (vh || 1) > 1.2 ? 1 : 0;
  const courses = 1 + (rnd() < 0.6 ? 1 : 0) + (rnd() < 0.35 ? 1 : 0) + extraCourses;
  const heights = [];
  for (let c = 0; c < courses; c++) heights.push(0.6 + rnd()*0.8);
  const hSum = heights.reduce((a,b)=>a+b, 0);

  // each course occupies a footprint window [lo,hi] along one axis; it must sit
  // within the window of the course below it (so it's always supported)
  const along = rnd() < 0.5;                  // which horizontal axis we split on
  let winLo = 0, winHi = 1;                   // full width at the base
  let y = 0;
  for (let c = 0; c < courses; c++){
    const isTop = (c === courses - 1);
    const ch = visH * heights[c] / hSum;
    const winW = winHi - winLo;

    // how many stones this course breaks into — more likely higher up
    const breakBias = c / Math.max(1, courses - 1);
    const n = 1 + (rnd() < 0.4 + 0.4*breakBias ? 1 : 0) + (rnd() < 0.2*breakBias ? 1 : 0);
    const segs = [0];
    for (let i = 1; i < n; i++) segs.push(segs[i-1] + (0.7 + rnd()*0.6));
    const segSpan = segs[n-1] + (0.7 + rnd()*0.6);

    // the course as a whole may occupy less than the full window below (inset
    // from one or both sides) — but always stays inside it, so it's supported
    let cLo = winLo, cHi = winHi;
    if (c > 0 && rough > 0 && rnd() < rough * 0.6){
      const shrink = rnd() * rough * 0.35 * winW;
      if (rnd() < 0.5) cLo += shrink; else cHi -= shrink;
    }
    const cW = cHi - cLo;

    for (let s = 0; s < n; s++){
      const p0 = (s === 0 ? 0 : segs[s]) / segSpan;
      const p1 = (s+1 < n ? segs[s+1] : segSpan) / segSpan;
      const lo = cLo + cW * p0, hi = cLo + cW * p1;
      let sh = ch, cy = y + sh/2;

      // roughness only erodes the TOP course: drop stones and shave heights,
      // never touching the supporting courses below
      if (rough > 0 && topTier && isTop){
        const isLastPossible = (s === n - 1 && placed === 0);
        if (rnd() < rough * 0.3 && !isLastPossible) continue;
        const cut = rnd() * rough * 0.55 * ch;
        sh = Math.max(CELL*0.12, ch - cut);
        cy = y + sh/2;                         // rests on the course floor
      }

      const mid = (lo + hi) / 2 - 0.5;         // centre offset from cell centre
      const size = (hi - lo);
      if (along){
        put(mid * w, cy, 0, size * w - inset, sh - inset, cW * d - inset, c*3 + s);
      } else {
        put(0, cy, mid * d, cW * w - inset, sh - inset, size * d - inset, c*3 + s);
      }
    }

    // the next course must sit within THIS course's footprint window
    winLo = cLo; winHi = cHi;
    y += ch;
  }

  if (placed === 0){
    put(0, CELL*0.3, 0, w - inset, CELL*0.6, d - inset, 0);
  }
  return placed;
}

// Purely-visual height variation for masonry obstacle blocks: a tumbledown
// skyline where some render short, some full, some with an extra course
// stacked above. This does NOT touch the logical `height` — the cell is still
// the same solid obstacle in routing; only what's drawn changes.
function masonryVisualHeight(faceIdx, u, v){
  const hv = featureOn('masonry') ? FEATURES.masonry.sliders[1].value / 100 : 0;
  if (hv <= 0) return 1;                          // full cube, as before
  const r = cellHash(faceIdx, u, v, 5171);
  // map to discrete levels so it reads as whole stones/courses, not a smooth
  // stretch: 0.35, 0.5, 0.7, 1.0 (full), 1.35, 1.7 — biased toward full
  const levels = [0.35, 0.5, 0.7, 1.0, 1.0, 1.0, 1.35, 1.7];
  const pick = levels[Math.floor(r * levels.length)];
  // hv scales how far from full we allow: at low hv most stay near 1
  return 1 + (pick - 1) * hv;
}

function addStack(faceIdx, u, v, height, cap){
  blocked.add(cellKey(faceIdx, u, v));
  const f = FACES[faceIdx];
  const base = cellToPoint(faceIdx, u, v);
  const q = new THREE.Quaternion().setFromUnitVectors(_upY, f.n);
  const masO = featureOn('masonry') ? FEATURES.masonry.slider.value / 100 : 0;
  // visual height only applies to the topmost tier of a masonry stack
  const vHeight = masonryVisualHeight(faceIdx, u, v);
  for (let i = 0; i < height; i++){
    // this tier is either one cast block or laid up from smaller stones
    const rnd = (cellHash(faceIdx, u, v, i * 977) );
    const isTop = (i === height - 1);
    if (masO > 0 && rnd < masO){
      const g = new THREE.Group();
      g.position.copy(base).addScaledVector(f.n, CELL * i);
      g.quaternion.copy(q);
      levelGroup.add(g);
      // only the top tier stretches/shrinks visually; lower tiers stay solid
      layStones(g, BLOCK, BLOCK, faceIdx, u, v, i, isTop, isTop ? vHeight : 1);
    } else {
      const m = new THREE.Mesh(blockGeo, stoneMat(i % 2 ? stoneB : stoneA, faceIdx, u, v, i));
      m.position.copy(base).addScaledVector(f.n, CELL * (i + 0.5));
      m.quaternion.copy(q);
      m.castShadow = true; m.receiveShadow = true;
      m.add(new THREE.LineSegments(blockEdges, edgeMat));
      levelGroup.add(m);
    }
  }
  if (cap){
    const c = new THREE.Mesh(new THREE.ConeGeometry(BLOCK*0.62, CELL*0.8, 4), capMat);
    c.castShadow = true;
    c.position.copy(base).addScaledVector(f.n, CELL * height + CELL * 0.4);
    c.quaternion.copy(q);
    c.rotateOnAxis(_upY, Math.PI/4);
    levelGroup.add(c);
  }
}

// rails: shelved system, kept ready
const rails = new Set();
const oneways = new Map();        // cellKey -> allowed exit direction (Vector3)
const onewayMeshes = [];
let gauntletSpine = null;         // Set of spine cellKeys (the intended path)
const wallRep = new Map();        // seamKey -> [fi,u,v,dir] mesh representative
const gauntletWallSeams = new Set(); // spine seams walled for portal bridges
const railKey = p =>
  Math.round(p.x/(CELL/2)) + ',' + Math.round(p.y/(CELL/2)) + ',' + Math.round(p.z/(CELL/2));
const RAIL_H = CELL * 0.22, RAIL_W = CELL * 0.09;
const railMat = new THREE.MeshLambertMaterial({ color:0x7a6a80 });
const railGeo = new THREE.BoxGeometry(CELL * 1.06, RAIL_H, RAIL_W);
// wall whose run reaches the rim: its end is MITRED at 45° — cut on the same
// bisector plane the edge fins stand on, so wrap-around walls meet each other
// (and the fins) perfectly flush, like picture framing
function makeMiterWallGeo(){
  const L = CELL * 0.53 + CELL * 0.5;   // inner overhang to the rim
  const E = 0.008;                      // hair's-width back-off: two meeting
  const s = new THREE.Shape();          // mitres never share the same plane
  s.moveTo(0, 0);
  s.lineTo(L - E, 0);
  s.lineTo(L + RAIL_H - E, RAIL_H);     // 45° mitre, backed off by E
  s.lineTo(0, RAIL_H);
  s.lineTo(0, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: RAIL_W, bevelEnabled:false });
  g.translate(0, 0, -RAIL_W/2);
  return g;
}
const railMiterGeo = makeMiterWallGeo();
// flat rim end for walls with nothing to meet: square cut exactly at the edge,
// anchored at the inner end like the mitre so both position identically
const RAIL_RUN = CELL * 1.03;
const railFlatGeo = new THREE.BoxGeometry(RAIL_RUN, RAIL_H, RAIL_W);
railFlatGeo.translate(RAIL_RUN/2, RAIL_H/2, 0);

function addRail(faceIdx, u, v, dir){
  const f = FACES[faceIdx];
  const [ta, tb] = basisOf(f.n);
  const axis = (dir[1] === 'u' ? ta : tb).clone().multiplyScalar(dir[0] === '+' ? 1 : -1);
  const along = dir[1] === 'u' ? tb : ta;
  const m = cellToPoint(faceIdx, u, v).addScaledVector(axis, CELL/2);
  rails.add(railKey(m));

  const zl = new THREE.Vector3().crossVectors(along, f.n);
  const q = new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(along, f.n, zl));

  const onCubeEdge = Math.abs(m.dot(axis)) > H - 1e-4;
  if (onCubeEdge){
    // an edge-running wall is a single standard-thickness fin standing on the
    // edge's angular bisector — one wall doing one wall's job
    const up = f.n.clone().add(axis).normalize();
    const fin = new THREE.Mesh(railGeo, railMat);
    fin.castShadow = true; fin.receiveShadow = true;
    fin.position.copy(m).addScaledVector(up, RAIL_H/2);
    fin.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
      along, up, new THREE.Vector3().crossVectors(along, up)));
    levelGroup.add(fin);
    return;
  }

  // in-face wall; if its run reaches the rim, the end depends on context:
  // something continues past it (a wrapping wall on the far face, or an edge
  // fin flanking the endpoint) -> 45° mitre to meet it flush.
  // nothing continues (open edge passage) -> clean flat cut at the rim.
  const runCoord = m.dot(along);
  const atEdge = Math.abs(runCoord) > H - CELL/2 - 1e-4;
  if (atEdge){
    const sgn = Math.sign(runCoord);
    const end = m.clone().addScaledVector(along, sgn * CELL/2);      // on the edge
    const mirror = m.clone().addScaledVector(along, sgn * CELL/2)
                            .addScaledVector(f.n, -CELL/2);          // seam across the rim
    const hasPartner =
      rails.has(railKey(mirror)) ||
      rails.has(railKey(end.clone().addScaledVector(axis,  CELL/2))) ||
      rails.has(railKey(end.clone().addScaledVector(axis, -CELL/2)));
    const xDir = along.clone().multiplyScalar(sgn);
    const mesh = new THREE.Mesh(hasPartner ? railMiterGeo : railFlatGeo, railMat);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.position.copy(m).addScaledVector(along, -sgn * CELL * 0.53);
    mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
      xDir, f.n, new THREE.Vector3().crossVectors(xDir, f.n)));
    levelGroup.add(mesh);
    return;
  }
  const mesh = new THREE.Mesh(railGeo, railMat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.position.copy(m).addScaledVector(f.n, RAIL_H/2);
  mesh.quaternion.copy(q);
  levelGroup.add(mesh);
}

// walkway tiles: shelved system, kept ready
const pathFaces = new Set();
const pathCells = new Set();
const TILE_H = CELL * 0.12;
const tileMat = new THREE.MeshLambertMaterial({ color:0xf6ecdc });
const tileGeo = new THREE.BoxGeometry(CELL * 0.98, TILE_H, CELL * 0.98);
function addPath(faceIdx, cells){
  pathFaces.add(faceIdx);
  const f = FACES[faceIdx];
  const q = new THREE.Quaternion().setFromUnitVectors(_upY, f.n);
  for (const [u, v] of cells){
    pathCells.add(cellKey(faceIdx, u, v));
    const t = new THREE.Mesh(tileGeo, tileMat);
    t.position.copy(cellToPoint(faceIdx, u, v)).addScaledVector(f.n, TILE_H/2);
    t.quaternion.copy(q);
    levelGroup.add(t);
  }
}

function walkable(faceIdx, u, v){
  if (blocked.has(cellKey(faceIdx, u, v))) return false;
  if (pathFaces.has(faceIdx) && !pathCells.has(cellKey(faceIdx, u, v))) return false;
  return true;
}

// ---------- surface graph ----------
// Neighbours in the true movement graph. NOTE: any feature that changes how
// the player moves MUST be taught here — the solvability check, the clock, and
// the solution trail all walk this graph. If it lies, they all lie.
function neighborsOf(fi, u, v, _hops){
  const out = [];
  // stepping onto a portal doesn't let you walk on from it: it delivers you to
  // the partner, so this cell's real exits are the partner's exits.
  const here = cellKey(fi, u, v);
  const link = portals.get(here);
  if (link && link.pair && (_hops || 0) < 4){
    const [pf, pu, pv] = link.pair.split(',').map(Number);
    return neighborsOf(pf, pu, pv, (_hops || 0) + 1);
  }
  // one-way cell: you may only leave in the arrow's direction. This makes the
  // graph DIRECTED — the solvability check, clock, and solution trail all walk
  // this same function, so teaching it here keeps all three honest.
  const oneWay = oneways.get(here);
  const n = FACES[fi].n;
  const [ta, tb] = basisOf(n);
  const P0 = cellToPoint(fi, u, v);
  for (const base of [ta, tb]){
    for (const s of [1, -1]){
      const d = base.clone().multiplyScalar(s);
      // one-way: skip any exit that isn't the permitted direction
      if (oneWay && d.dot(oneWay) < 0.9) continue;
      // a rail on this seam severs the connection
      if (rails.has(railKey(P0.clone().addScaledVector(d, CELL/2)))) continue;
      const cand = P0.clone().addScaledVector(d, CELL);
      const inside =
        Math.abs(cand.dot(ta)) <= H - CELL/2 + 1e-4 &&
        Math.abs(cand.dot(tb)) <= H - CELL/2 + 1e-4;
      if (inside){
        const c = pointToCell(fi, cand);
        out.push([fi, c.u, c.v]);
      } else {
        const toP = P0.clone().addScaledVector(d, CELL/2).addScaledVector(n, -CELL/2);
        const nf = faceIndexOf(d);
        const c = pointToCell(nf, toP);
        out.push([nf, c.u, c.v]);
      }
    }
  }
  return out;
}

function surfaceConnected(){
  const total = 6*N*N - blocked.size - holes.size;
  const startK = cellKey(2,2,2);
  if (blocked.has(startK)) return false;
  const seen = new Set([startK]);
  const stack = [[2,2,2]];
  while (stack.length){
    const [fi,u,v] = stack.pop();
    for (const [nf,nu,nv] of neighborsOf(fi,u,v)){
      const k = cellKey(nf,nu,nv);
      if (seen.has(k) || blocked.has(k) || holes.has(k)) continue;
      seen.add(k); stack.push([nf,nu,nv]);
    }
  }
  return seen.size === total;
}

// ---------- procedural maze ----------
function generateObstacles(count){
  let placed = 0, guard = 0;
  while (placed < count && guard++ < count * 40){
    const fi = (Math.random()*6)|0;
    const u = (Math.random()*N)|0, v = (Math.random()*N)|0;
    if (fi === 2 && u === 2 && v === 2) continue;
    const k = cellKey(fi,u,v);
    if (blocked.has(k) || k === finishKey) continue;
    blocked.add(k);
    if (!surfaceConnected()){ blocked.delete(k); continue; }
    // occasionally this landmark becomes a little monument instead of a stack.
    // Rare by construction — most cells stay flat, so they read as landmarks.
    const monO = featureOn('monuments') ? FEATURES.monuments.slider.value / 100 : 0;
    if (monO > 0 && Math.random() < monO * 0.22){
      const kind = MONUMENTS[(Math.random()*MONUMENTS.length)|0];
      addMonument(kind, fi, u, v);
      monumentCells.push(cellKey(fi, u, v));
      placed++;
      continue;
    }
    // mostly flat so the surface stays readable, but the occasional stack —
    // and the rare capped tower — keeps the skyline charming. Rarity is what
    // makes a tower a landmark instead of clutter.
    let h = 1;
    if (Math.random() < 0.18) h++;
    if (Math.random() < 0.2) h++;           // ~3.5% reach three
    addStack(fi, u, v, h, h >= 3);          // every tower gets its pyramid cap
    placed++;
  }
}

// procedural rails: same discipline as blocks — any rail that would seal
// off a region is rejected, so the surface always stays one walkable whole
function generateRails(count){
  const dirs = ['+u','-u','+v','-v'];
  const tmp = new THREE.Vector3();
  let placed = 0, guard = 0;
  while (placed < count && guard++ < count * 40){
    const fi = (Math.random()*6)|0;
    const u = (Math.random()*N)|0, v = (Math.random()*N)|0;
    const dir = dirs[(Math.random()*4)|0];
    if (blocked.has(cellKey(fi,u,v))) continue;   // seams beside open floor only
    const [ta, tb] = basisOf(FACES[fi].n);
    const axis = (dir[1]==='u'?ta:tb).clone().multiplyScalar(dir[0]==='+'?1:-1);
    const key = railKey(tmp.copy(cellToPoint(fi,u,v)).addScaledVector(axis, CELL/2));
    if (rails.has(key)) continue;
    rails.add(key);
    if (!surfaceConnected()){ rails.delete(key); continue; }
    rails.delete(key);
    addRail(fi, u, v, dir);   // re-adds the key and builds the mesh
    placed++;
  }
}

// holes: real recessed shafts cut into the cube — walkable, that's the trap
const holes = new Set();
const holeList = [];
const HOLE_OPEN = CELL * 0.78;   // opening size (matches the alpha-cut window)
const HOLE_DEPTH = CELL * 1.15;
const shaftWallMat = new THREE.MeshLambertMaterial({ color:0x2c2536, side:THREE.DoubleSide });
const shaftFloorMat = new THREE.MeshLambertMaterial({ color:0x140f1e });

function addHole(faceIdx, u, v){
  holes.add(cellKey(faceIdx, u, v));
  holeList.push([faceIdx, u, v]);
  const n = FACES[faceIdx].n;
  const [ta, tb] = basisOf(n);
  const base = cellToPoint(faceIdx, u, v);        // opening, flush with the face
  const q = new THREE.Quaternion().setFromUnitVectors(_upY, n);

  // four walls descending inward
  const wallGeo = new THREE.PlaneGeometry(HOLE_OPEN, HOLE_DEPTH);
  for (const [dir, side] of [[ta,1],[ta,-1],[tb,1],[tb,-1]]){
    const w = new THREE.Mesh(wallGeo, shaftWallMat);
    w.position.copy(base)
      .addScaledVector(dir, side * HOLE_OPEN/2)
      .addScaledVector(n, -HOLE_DEPTH/2);
    // plane's +z should face inward (toward shaft center = -dir*side)
    const zAxis = dir.clone().multiplyScalar(-side);
    const yAxis = n.clone().multiplyScalar(-1);    // down the shaft
    const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis);
    w.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));
    levelGroup.add(w);
  }
  // floor at the bottom
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(HOLE_OPEN, HOLE_OPEN), shaftFloorMat);
  floor.position.copy(base).addScaledVector(n, -HOLE_DEPTH);
  floor.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(_planeZ, n));
  levelGroup.add(floor);
}
const _planeZ = new THREE.Vector3(0,0,1);

// same discipline again: a hole that would sever the only route is rejected
function generateHoles(count){
  let placed = 0, guard = 0;
  while (placed < count && guard++ < count * 40){
    const fi = (Math.random()*6)|0;
    const u = (Math.random()*N)|0, v = (Math.random()*N)|0;
    if (fi === 2 && u === 2 && v === 2) continue;
    const k = cellKey(fi,u,v);
    if (blocked.has(k) || holes.has(k) || k === finishKey) continue;
    holes.add(k);
    if (!surfaceConnected()){ holes.delete(k); continue; }
    holes.delete(k);
    addHole(fi, u, v);
    placed++;
  }
}

// bridges: hollow arches — pass through along the axis, the legs wall the sides.
// The side-blocking IS the rail system: each bridge adds its two side seams to
// the rails set, so movement rules and connectivity checks come for free.
// The deck sits at block height, ready to become walkable when layers arrive.
const bridged = new Set();
const BR_CLEAR = CELL * 0.78;    // tunnel clearance (player is 0.62 tall)
const BR_DECK_T = CELL * 0.22;
const BR_LEG_W = CELL * 0.12;
let bridgeLegGeo, bridgeDeckGeo, bridgeLegEdges, bridgeDeckEdges;
function rebuildBridgeGeo(){
  for (const g of [bridgeLegGeo, bridgeDeckGeo, bridgeLegEdges, bridgeDeckEdges])
    if (g) g.dispose();
  const b = bevelAmount();
  bridgeLegGeo = bevelledBox(CELL, BR_CLEAR, BR_LEG_W, Math.min(b, BR_LEG_W*0.3));
  bridgeDeckGeo = bevelledBox(CELL * 1.06, BR_DECK_T, CELL, Math.min(b, BR_DECK_T*0.3));
  bridgeLegEdges = new THREE.EdgesGeometry(bridgeLegGeo, 30);
  bridgeDeckEdges = new THREE.EdgesGeometry(bridgeDeckGeo, 30);
}
rebuildBridgeGeo();

function addBridge(faceIdx, u, v, alongU){
  const n = FACES[faceIdx].n;
  const [ta, tb] = basisOf(n);
  const along = alongU ? ta : tb;
  const across = alongU ? tb : ta;
  const base = cellToPoint(faceIdx, u, v);
  const zA = new THREE.Vector3().crossVectors(along, n);
  const q = new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(along, n, zA));
  for (const s of [1, -1]){
    const leg = new THREE.Mesh(bridgeLegGeo, stoneB);
    leg.castShadow = true; leg.receiveShadow = true;
    leg.position.copy(base)
      .addScaledVector(across, s * (CELL/2 - BR_LEG_W/2))
      .addScaledVector(n, BR_CLEAR/2);
    leg.quaternion.copy(q);
    leg.add(new THREE.LineSegments(bridgeLegEdges, edgeMat));
    levelGroup.add(leg);
  }
  const deck = new THREE.Mesh(bridgeDeckGeo, stoneA);
  deck.castShadow = true; deck.receiveShadow = true;
  deck.position.copy(base).addScaledVector(n, BR_CLEAR + BR_DECK_T/2);
  deck.quaternion.copy(q);
  deck.add(new THREE.LineSegments(bridgeDeckEdges, edgeMat));
  levelGroup.add(deck);
}

function generateBridges(count){
  const tmp = new THREE.Vector3();
  let placed = 0, guard = 0;
  while (placed < count && guard++ < count * 40){
    const fi = (Math.random()*6)|0;
    const u = 1 + ((Math.random()*(N-2))|0);   // interior cells only
    const v = 1 + ((Math.random()*(N-2))|0);
    if (fi === 2 && u === 2 && v === 2) continue;
    const k = cellKey(fi,u,v);
    if (blocked.has(k) || holes.has(k) || bridged.has(k) || k === finishKey) continue;
    const alongU = Math.random() < 0.5;
    const [ta, tb] = basisOf(FACES[fi].n);
    const across = alongU ? tb : ta;
    const c = cellToPoint(fi,u,v);
    const k1 = railKey(tmp.copy(c).addScaledVector(across,  CELL/2));
    const k2 = railKey(tmp.copy(c).addScaledVector(across, -CELL/2));
    if (rails.has(k1) || rails.has(k2)) continue;
    rails.add(k1); rails.add(k2);
    if (!surfaceConnected()){ rails.delete(k1); rails.delete(k2); continue; }
    bridged.add(k);
    addBridge(fi, u, v, alongU);   // the seam keys stay: they are the walls
    placed++;
  }
}

// ---------- one-way tiles ----------
// Arrows you can only cross in one direction. This makes the movement graph
// DIRECTED, so placement must preserve reachability: after adding an arrow we
// run a directed flood-fill from the start and reject it if it strands any
// cell. Undirected connectivity is no longer enough.
function directedReachCount(){
  const start = cellKey(2,2,2);
  const seen = new Set([start]);
  const q = [[2,2,2]];
  for (let h = 0; h < q.length; h++){
    const [a,b,c] = q[h];
    for (const [nf,nu,nv] of neighborsOf(a,b,c)){
      const k = cellKey(nf,nu,nv);
      if (seen.has(k) || blocked.has(k) || holes.has(k)) continue;
      seen.add(k); q.push([nf,nu,nv]);
    }
  }
  return seen.size;
}
function totalWalkable(){
  let n = 0;
  for (let fi=0; fi<6; fi++) for (let u=0; u<N; u++) for (let v=0; v<N; v++){
    const k = cellKey(fi,u,v);
    if (!blocked.has(k) && !holes.has(k)) n++;
  }
  return n;
}
// how many cells can reach the start (reverse reachability). Combined with
// forward reachability, this proves strong connectivity: if every cell reaches
// start AND start reaches every cell, then any cell can reach any other —
// which is what a gem TOUR needs, not just single-target reachability.
function reverseReachCount(){
  // BFS on the REVERSED directed graph: cell X can reach start iff start is
  // reachable following edges backward from... easier: find all cells that can
  // reach start by checking, for each cell, whether start is forward-reachable.
  // Cheaper: build reverse adjacency once and flood from start.
  const revAdj = new Map();
  const cells = [];
  for (let fi=0; fi<6; fi++) for (let u=0; u<N; u++) for (let v=0; v<N; v++){
    const k = cellKey(fi,u,v);
    if (blocked.has(k) || holes.has(k)) continue;
    cells.push([fi,u,v]);
  }
  for (const [fi,u,v] of cells){
    for (const [nf,nu,nv] of neighborsOf(fi,u,v)){
      const nk = cellKey(nf,nu,nv);
      if (blocked.has(nk) || holes.has(nk)) continue;
      if (!revAdj.has(nk)) revAdj.set(nk, []);
      revAdj.get(nk).push(cellKey(fi,u,v));    // edge fi->nf reversed
    }
  }
  const start = cellKey(2,2,2);
  const seen = new Set([start]);
  const q = [start];
  for (let h = 0; h < q.length; h++){
    for (const p of (revAdj.get(q[h]) || [])){
      if (!seen.has(p)){ seen.add(p); q.push(p); }
    }
  }
  return seen.size;
}
function generateOneWays(count){
  const target = totalWalkable();
  let placed = 0, tries = 0;
  while (placed < count && tries < count * 30){
    tries++;
    const fi = (Math.random()*6)|0, u = (Math.random()*N)|0, v = (Math.random()*N)|0;
    const k = cellKey(fi,u,v);
    if (fi === 2 && u === 2 && v === 2) continue;
    if (blocked.has(k) || holes.has(k) || oneways.has(k) || portals.has(k)) continue;
    const exits = neighborsOf(fi, u, v);
    if (exits.length < 2) continue;            // don't trap dead-ends
    const [ta, tb] = basisOf(FACES[fi].n);
    const dirs = [ta, ta.clone().negate(), tb, tb.clone().negate()];
    const dir = dirs[(Math.random()*4)|0];
    oneways.set(k, dir);
    // STRONG connectivity: start reaches all AND all reach start. Only then can
    // a gem tour always continue from wherever it currently stands.
    if (directedReachCount() < target || reverseReachCount() < target){
      oneways.delete(k);                        // would strand the tour — reject
      continue;
    }
    placed++;
  }
}

// draw a chevron arrow on each one-way cell, pointing the way you may leave
const onewayGeo = (() => {
  const shape = new THREE.Shape();
  shape.moveTo(0.30, 0); shape.lineTo(-0.18, 0.24); shape.lineTo(-0.06, 0);
  shape.lineTo(-0.18, -0.24); shape.closePath();
  return new THREE.ShapeGeometry(shape);
})();
const onewayMat = new THREE.MeshBasicMaterial({
  color:0xf5b942, transparent:true, opacity:0.9, side:THREE.DoubleSide,
  depthWrite:false });
function drawOneways(){
  for (const [k, dir] of oneways){
    const [fi, u, v] = k.split(',').map(Number);
    const n = FACES[fi].n;
    const base = cellToPoint(fi, u, v);
    const m = new THREE.Mesh(onewayGeo, onewayMat);
    m.position.copy(base).addScaledVector(n, CELL*0.04 + faceLift(fi));
    const zAxis = n.clone();
    const xAxis = dir.clone().normalize();
    const yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis);
    m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));
    m.scale.setScalar(CELL * 0.95);
    levelGroup.add(m);
    onewayMeshes.push(m);
  }
}

// ---------- portals: linked doorways, matching colours connect ----------
// Built like holes (a cut opening over a recessed shaft) but tinted per pair.
// Step in, sink, and rise out of the partner — the cube swivels to present
// the destination face. Portals only ADD connectivity, so every solvability
// guarantee holds untouched.
const portals = new Map();       // cellKey -> { pair: cellKey }
const portalList = [];           // [fi,u,v] for texture cutting
const portalFX = new Map();      // cellKey -> { lightMat, light, flare }
const PORTAL_COLORS = [0xe8608a, 0x4fb3bf, 0xe0a83c, 0x8f6fd6];
const LIGHT_H = CELL * 1.3;
const portalLightGeo = new THREE.PlaneGeometry(HOLE_OPEN, LIGHT_H);
// vertical fade: opaque at the mouth, dissolving into the air at the top
const lightGradTex = (() => {
  const c = document.createElement('canvas'); c.width = 4; c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 128, 0, 0);
  grad.addColorStop(0,    'rgba(255,255,255,0.9)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0.35)');
  grad.addColorStop(1,    'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 4, 128);
  return new THREE.CanvasTexture(c);
})();

function addPortalCell(fi, u, v, wallMat, floorMat, col){
  const n = FACES[fi].n;
  const [ta, tb] = basisOf(n);
  const base = cellToPoint(fi, u, v);
  const wallGeo = new THREE.PlaneGeometry(HOLE_OPEN, HOLE_DEPTH);
  for (const [dir, side] of [[ta,1],[ta,-1],[tb,1],[tb,-1]]){
    const w = new THREE.Mesh(wallGeo, wallMat);
    w.position.copy(base)
      .addScaledVector(dir, side * HOLE_OPEN/2)
      .addScaledVector(n, -HOLE_DEPTH/2);
    const zAxis = dir.clone().multiplyScalar(-side);
    const yAxis = n.clone().multiplyScalar(-1);
    const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis);
    w.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));
    levelGroup.add(w);
  }
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(HOLE_OPEN, HOLE_OPEN), floorMat);
  floor.position.copy(base).addScaledVector(n, -HOLE_DEPTH);
  floor.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(_planeZ, n));
  levelGroup.add(floor);
  // light rising straight out of the opening: four planes matching the shaft
  // walls, brightest at the mouth, fading naturally into the air. Where they
  // meet, the additive blend doubles — the column's corners shine brightest.
  const lightMat = new THREE.MeshBasicMaterial({
    color: col, map: lightGradTex, transparent:true, opacity:0.32,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
  for (const [dir, side] of [[ta,1],[ta,-1],[tb,1],[tb,-1]]){
    const p = new THREE.Mesh(portalLightGeo, lightMat);
    p.position.copy(base)
      .addScaledVector(dir, side * HOLE_OPEN/2)
      .addScaledVector(n, LIGHT_H/2);
    const zAxis = dir.clone().multiplyScalar(side);
    const xAxis = new THREE.Vector3().crossVectors(n, zAxis);
    p.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, n, zAxis));
    levelGroup.add(p);
  }
  const light = new THREE.PointLight(col.getHex(), 0.45, 2.8, 2);
  light.position.copy(base).addScaledVector(n, 0.5);
  levelGroup.add(light);
  portalFX.set(cellKey(fi,u,v), { lightMat, light, flare:0 });
}

function generatePortals(pairs){
  const free = () => {
    for (let t = 0; t < 60; t++){
      const fi = (Math.random()*6)|0, u = (Math.random()*N)|0, v = (Math.random()*N)|0;
      const k = cellKey(fi,u,v);
      if (fi === 2 && u === 2 && v === 2) continue;
      if (blocked.has(k) || holes.has(k) || bridged.has(k) || portals.has(k)
          || oneways.has(k) || k === finishKey) continue;
      return { fi, u, v, k };
    }
    return null;
  };
  for (let i = 0; i < pairs; i++){
    const a = free(); if (!a) return;
    portals.set(a.k, {});                        // reserve before drawing b
    const b = free();
    if (!b){ portals.delete(a.k); return; }
    portals.set(a.k, { pair: b.k });
    portals.set(b.k, { pair: a.k });
    portalList.push([a.fi,a.u,a.v], [b.fi,b.u,b.v]);
    const col = new THREE.Color(PORTAL_COLORS[i % PORTAL_COLORS.length]);
    const note = [329.63, 392.00, 440.00, 523.25][i % 4];   // E4 G4 A4 C5
    const wallMat = new THREE.MeshLambertMaterial({
      color: col.clone().multiplyScalar(0.5), side: THREE.DoubleSide });
    const floorMat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(0.3) });
    addPortalCell(a.fi, a.u, a.v, wallMat, floorMat, col);
    addPortalCell(b.fi, b.u, b.v, wallMat, floorMat, col);
    portalFX.get(a.k).note = note;
    portalFX.get(b.k).note = note;
  }
}

// ---------- gems ----------
const gems = [];
let gemCount = 0, gemsTotal = 0;
const gemGeo = new THREE.OctahedronGeometry(CELL*0.22);
const gemMat = new THREE.MeshLambertMaterial({ color:0xd9a63a, emissive:0x8a5f10, emissiveIntensity:0.5 });

function spawnGems(count){
  const taken = new Set([cellKey(2,2,2)]);
  let made = 0, guard = 0;
  while (made < count && guard++ < 800){
    const fi = (Math.random()*6)|0;
    const u = (Math.random()*N)|0, v = (Math.random()*N)|0;
    const k = cellKey(fi,u,v);
    if (taken.has(k) || holes.has(k) || portals.has(k) || !walkable(fi,u,v)) continue;
    taken.add(k);
    const pos = cellToPoint(fi, u, v);
    const m = new THREE.Mesh(gemGeo, gemMat.clone());
    m.castShadow = true;
    m.position.copy(pos).addScaledVector(FACES[fi].n, CELL*0.35 + faceLift(fi));
    m.quaternion.setFromUnitVectors(_upY, FACES[fi].n);
    levelGroup.add(m);
    gems.push({ face:fi, pos, mesh:m, taken:false, phase:Math.random()*6 });
    made++;
  }
  return made;
}

function checkGem(){
  const fi = faceIndexOf(Nf);
  for (const g of gems){
    if (!g.taken && g.face === fi && g.pos.distanceTo(P) < CELL*0.4){
      g.taken = true;
      levelGroup.remove(g.mesh);
      gemCount++;
      // ascending pentatonic — a collection run reads as a phrase, not repetition
      const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];
      const semis = scale[Math.min(gemCount - 1, scale.length - 1)];
      sfxBell(523.25 * Math.pow(2, semis/12), 0.7, 0.22);
      for (const fk of Object.keys(FEATURES))
        if (FEATURES[fk].on && FEATURES[fk].onGem) FEATURES[fk].onGem();
      updateGemHUD();
      if (gemCount >= gemsTotal){
        if (featureOn('keystone') && keystoneCell) awakenKeystone();
        else levelComplete();
      }
    }
  }
}

// place the keystone: a low shrine dais on a walkable cell, as far from the
// start as reachability allows, so reaching it is a genuine journey. Walkable
// and reachable, so it never blocks solvability — it's a destination, not a wall.
function placeKeystone(){
  const dist = bfsFrom(2, 2, 2);              // steps from the start cell
  let best = null, bestD = -1;
  for (const [k, d] of dist){
    const [fi, u, v] = k.split(',').map(Number);
    if (fi === 2 && u === 2 && v === 2) continue;
    if (holes.has(k) || portals.has(k)) continue;
    // avoid sitting on a gem cell
    let onGem = false;
    for (const g of gems){ const gc = pointToCell(g.face, g.pos);
      if (g.face === fi && gc.u === u && gc.v === v){ onGem = true; break; } }
    if (onGem) continue;
    if (d > bestD){ bestD = d; best = k; }
  }
  if (!best) return;
  keystoneCell = best;
  const [fi, u, v] = best.split(',').map(Number);
  const n = FACES[fi].n;
  const base = cellToPoint(fi, u, v);
  const q = new THREE.Quaternion().setFromUnitVectors(_upY, n);
  const g = new THREE.Group();
  g.position.copy(base); g.quaternion.copy(q);
  levelGroup.add(g);
  keystoneGroup = g;
  // a low two-tier dais with a small standing stone — reads as a shrine, but
  // flat enough to stand on
  const daisMat = new THREE.MeshLambertMaterial({ color:0xe0d0b8 });
  const d1 = new THREE.Mesh(bevelledBox(CELL*0.9, CELL*0.12, CELL*0.9, bevelAmount()), daisMat);
  d1.position.set(0, CELL*0.06, 0); d1.castShadow = true; d1.receiveShadow = true;
